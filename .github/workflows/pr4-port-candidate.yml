name: PR4 feature-only port and validation

on:
  push:
    branches:
      - automation/pr4-port-candidate-20261010
    paths:
      - .github/workflows/pr4-port-candidate.yml
  workflow_dispatch:

permissions:
  contents: write
  packages: read

concurrency:
  group: pr4-feature-only-port-candidate
  cancel-in-progress: true

jobs:
  port-and-validate:
    name: Port only requested feature delta onto restored main
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git and pin source refs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name "Snn1452"
          git config user.email "snn1452@gmail.com"
          git fetch origin '+refs/heads/main:refs/remotes/origin/main' '+refs/heads/integration/msix-release:refs/remotes/origin/integration/msix-release'
          $mainSha = (git rev-parse refs/remotes/origin/main).Trim()
          $integrationSha = (git rev-parse refs/remotes/origin/integration/msix-release).Trim()
          if ($mainSha -cne '4cf39fd9ebd36477a251f4f2dda94657a15c2557') {
            throw "Restored main changed unexpectedly: $mainSha"
          }
          if ($integrationSha -cne '2ba1b7b7b312e580a3774c80c5175cab51abd21a') {
            throw "Integration source changed unexpectedly; refusing to apply a stale patch: $integrationSha"
          }
          # This is the actual integration base recorded by Git history, not upstream feature/vNext.
          $patchBase = '1375a84015f6c1e9592fe310b5849bf958de2c96'
          $featureMergeBase = (git merge-base $patchBase $integrationSha).Trim()
          if ($featureMergeBase -cne $patchBase) { throw "The audited integration base is no longer an ancestor: $featureMergeBase" }
          "PORT_MAIN_SHA=$mainSha" >> $env:GITHUB_ENV
          "PORT_INTEGRATION_SHA=$integrationSha" >> $env:GITHUB_ENV
          "PORT_PATCH_BASE=$patchBase" >> $env:GITHUB_ENV
          "Restored main (port target): $mainSha" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "Integration source: $integrationSha" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "Actual pre-integration base: $patchBase (verified merge-base)" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Three-way port only the 53 feature paths onto restored main
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $paths = @(
            '.github/workflows/background-notification-runtime.yml',
            '.github/workflows/native-aot.yml',
            'Directory.Build.targets',
            'WinoMail.slnx',
            'global.json',
            'scripts/release/build-releases.ps1',
            'src/Wino.Core.Domain/Interfaces/IKeyPressService.cs',
            'src/Wino.Core.Domain/Interfaces/IStoreManagementService.cs',
            'src/Wino.Core/Services/SynchronizationManager.cs',
            'src/Wino.Mail.BackgroundSyncHost/AutoSynchronizationService.cs',
            'src/Wino.Mail.BackgroundSyncHost/BackgroundAppMetadataService.cs',
            'src/Wino.Mail.BackgroundSyncHost/BackgroundKeyPressService.cs',
            'src/Wino.Mail.BackgroundSyncHost/BackgroundMicrosoftStoreService.cs',
            'src/Wino.Mail.BackgroundSyncHost/BackgroundNativeAppService.cs',
            'src/Wino.Mail.BackgroundSyncHost/BackgroundNotificationHostClient.cs',
            'src/Wino.Mail.BackgroundSyncHost/BackgroundStatePersistenceService.cs',
            'src/Wino.Mail.BackgroundSyncHost/BackgroundStoreManagementService.cs',
            'src/Wino.Mail.BackgroundSyncHost/CalendarReminderService.cs',
            'src/Wino.Mail.BackgroundSyncHost/HeadlessExternalBrowserAuthenticationPresenter.cs',
            'src/Wino.Mail.BackgroundSyncHost/HeadlessMailDialogServiceProxy.cs',
            'src/Wino.Mail.BackgroundSyncHost/HeadlessNotificationBuilder.cs',
            'src/Wino.Mail.BackgroundSyncHost/HeadlessNotificationPayloadBuilder.cs',
            'src/Wino.Mail.BackgroundSyncHost/PackagedApplicationActivator.cs',
            'src/Wino.Mail.BackgroundSyncHost/Program.cs',
            'src/Wino.Mail.BackgroundSyncHost/Wino.Mail.BackgroundSyncHost.csproj',
            'src/Wino.Mail.WinUI/App.xaml.cs',
            'src/Wino.Mail.WinUI/Package.appxmanifest',
            'src/Wino.Mail.WinUI/PackagedApplicationActivator.cs',
            'src/Wino.Mail.WinUI/Program.cs',
            'src/Wino.Mail.WinUI/Services/ConfigurationService.cs',
            'src/Wino.Mail.WinUI/Services/NotificationHostClient.cs',
            'src/Wino.Mail.WinUI/Services/NotificationHostProcessSupervisor.cs',
            'src/Wino.Mail.WinUI/Services/ShellUserPresenceStateProvider.cs',
            'src/Wino.Mail.WinUI/ShellWindow.xaml.cs',
            'src/Wino.Mail.WinUI/Views/Mail/MailListPage.xaml.cs',
            'src/Wino.Mail.WinUI/Views/WinoAppShell.xaml',
            'src/Wino.Mail.WinUI/Wino.Mail.WinUI.csproj',
            'src/Wino.NotificationHost.Contracts/NotificationHostApplicationIds.cs',
            'src/Wino.NotificationHost.Contracts/NotificationHostCodec.cs',
            'src/Wino.NotificationHost.Contracts/NotificationHostEnvelope.cs',
            'src/Wino.NotificationHost.Contracts/NotificationHostFileStore.cs',
            'src/Wino.NotificationHost.Contracts/NotificationHostPaths.cs',
            'src/Wino.NotificationHost.Contracts/NotificationHostOperation.cs',
            'src/Wino.NotificationHost.Contracts/NotificationPayloadValidator.cs',
            'src/Wino.NotificationHost/NotificationHostLogger.cs',
            'src/Wino.NotificationHost/Program.cs',
            'src/Wino.Platform.Windows/NotificationHostDispatcher.cs',
            'src/Wino.Platform.Windows/ToastNotificationDispatcher.cs',
            'src/Wino.Platform.Windows/Wino.Platform.Windows.csproj',
            'tests/Wino.NotificationHost.Tests/NotificationHostCodecTests.cs',
            'tests/Wino.NotificationHost.Tests/NotificationHostFileStoreTests.cs',
            'tests/Wino.NotificationHost.Tests/NotificationHostIdentityTests.cs',
            'tests/Wino.NotificationHost.Tests/NotificationHostProcessSupervisorTests.cs',
            'tests/Wino.NotificationHost.Tests/NotificationPayloadValidatorTests.cs',
            'tests/Wino.NotificationHost.Tests/ReleaseIdentityTests.cs',
            'tests/Wino.NotificationHost.Tests/Wino.NotificationHost.Tests.csproj',
            'tests/Wino.Services.AotSmoke/Program.cs',
            'tests/Wino.Services.AotSmoke/Wino.Services.AotSmoke.csproj',
            'tests/scripts/Build-Beta-TestBundle.ps1'
          )
          $baseFiles = @(git ls-tree -r --name-only $env:PORT_PATCH_BASE -- $paths)
          if ($LASTEXITCODE -ne 0) { throw 'Could not inspect the feature base tree.' }
          $mainFiles = @(git ls-tree -r --name-only $env:PORT_MAIN_SHA -- $paths)
          if ($LASTEXITCODE -ne 0) { throw 'Could not inspect restored main tree.' }
          $featureFiles = @(git ls-tree -r --name-only $env:PORT_INTEGRATION_SHA -- $paths)
          if ($LASTEXITCODE -ne 0) { throw 'Could not inspect integration feature tree.' }
          $changedPaths = @(git diff --name-only $env:PORT_PATCH_BASE $env:PORT_INTEGRATION_SHA -- $paths)
          if ($LASTEXITCODE -ne 0) { throw 'Could not enumerate the feature delta.' }
          if ($changedPaths.Count -ne 53) { throw "Expected the audited 53-path feature delta, found $($changedPaths.Count)." }
          "Feature delta paths audited: $($changedPaths.Count)" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append

          $conflicts = [System.Collections.Generic.List[string]]::new()
          $temporaryRoot = Join-Path $env:RUNNER_TEMP 'pr4-three-way'
          New-Item -ItemType Directory -Force -Path $temporaryRoot | Out-Null
          $index = 0
          foreach ($featurePath in $paths) {
            if ($changedPaths -notcontains $featurePath) { continue }
            $index++
            $baseExists = $baseFiles -contains $featurePath
            $mainExists = $mainFiles -contains $featurePath
            $sourceExists = $featureFiles -contains $featurePath
            if (-not $sourceExists) { throw "Audited feature file '$featurePath' is absent from integration." }

            if (-not $baseExists) {
              if (-not $mainExists) {
                git checkout $env:PORT_INTEGRATION_SHA -- $featurePath
                if ($LASTEXITCODE -ne 0) { throw "Could not add feature-only file '$featurePath'." }
                git add -- $featurePath
                if ($LASTEXITCODE -ne 0) { throw "Could not stage feature-only file '$featurePath'." }
                Write-Host "Added feature-only file: $featurePath"
              }
              elseif ($featurePath -eq 'src/Wino.Platform.Windows/Wino.Platform.Windows.csproj') {
                # Keep main's pre-existing platform project; only add the contract reference needed by the new dispatcher.
                $project = Get-Content -LiteralPath $featurePath -Raw
                if ($project -notmatch 'Wino\.NotificationHost\.Contracts\.csproj') {
                  $anchor = '<ProjectReference Include="..\Wino.Core.Domain\Wino.Core.Domain.csproj" />'
                  if (-not $project.Contains($anchor)) { throw "Could not locate platform project core-domain reference." }
                  $project = $project.Replace($anchor, $anchor + [Environment]::NewLine + '    <ProjectReference Include="..\Wino.NotificationHost.Contracts\Wino.NotificationHost.Contracts.csproj" />')
                  Set-Content -LiteralPath $featurePath -Value $project -NoNewline
                  git add -- $featurePath
                  if ($LASTEXITCODE -ne 0) { throw 'Could not stage platform contract reference.' }
                }
                Write-Host 'Preserved main platform project and added only the contract reference.'
              }
              else {
                throw "Feature path '$featurePath' has no upstream base blob but already exists on main; refusing to overwrite without a common base."
              }
              continue
            }

            if (-not $mainExists) {
              Write-Host "Skipped refactor-only path not present on restored main: $featurePath"
              continue
            }
            if ($featurePath -eq 'global.json') {
              Write-Host 'Retained restored main SDK version; SDK pin is not part of the runtime feature.'
              continue
            }

            $baseFile = Join-Path $temporaryRoot ("{0}.base" -f $index)
            $sourceFile = Join-Path $temporaryRoot ("{0}.source" -f $index)
            $baseText = (git show ($env:PORT_PATCH_BASE + ':' + $featurePath) | Out-String)
            if ($LASTEXITCODE -ne 0) { throw "Could not read feature base blob for '$featurePath'." }
            $sourceText = (git show ($env:PORT_INTEGRATION_SHA + ':' + $featurePath) | Out-String)
            if ($LASTEXITCODE -ne 0) { throw "Could not read feature source blob for '$featurePath'." }
            Set-Content -LiteralPath $baseFile -Value $baseText -NoNewline
            Set-Content -LiteralPath $sourceFile -Value $sourceText -NoNewline
            $mainFile = (Resolve-Path -LiteralPath $featurePath).Path

            $mergedLines = & git merge-file --diff3 -p -L 'restored-main' -L 'feature-vNext-base' -L 'integration-feature-delta' $mainFile $baseFile $sourceFile
            $mergeExit = $LASTEXITCODE
            $mergedText = [string]::Join([Environment]::NewLine, $mergedLines)
            Set-Content -LiteralPath $featurePath -Value $mergedText -NoNewline
            if ($mergeExit -eq 1 -or $mergedText -match '(?m)^<<<<<<< ') {
              $conflicts.Add($featurePath)
              Write-Host "MERGE CONFLICT: $featurePath"
            }
            elseif ($mergeExit -ne 0) {
              throw "git merge-file failed for '$featurePath' with code $mergeExit."
            }
            git add -- $featurePath
            if ($LASTEXITCODE -ne 0) { throw "Could not stage merged feature file '$featurePath'." }
          }

          # Resolve WinoMail.slnx by preserving restored main's project model and adding only feature projects.
          if ($conflicts.Contains('WinoMail.slnx')) {
            $solutionPath = 'WinoMail.slnx'
            git checkout $env:PORT_MAIN_SHA -- $solutionPath
            if ($LASTEXITCODE -ne 0) { throw 'Could not restore the main solution before applying feature project entries.' }
            $doc = New-Object System.Xml.XmlDocument
            $doc.PreserveWhitespace = $false
            $doc.Load((Resolve-Path -LiteralPath $solutionPath).Path)
            $libsFolder = $doc.SelectSingleNode('/Solution/Folder[@Name="/libs/"]')
            if ($null -eq $libsFolder) { throw 'Main solution has no /libs/ folder.' }
            $testsFolder = $doc.SelectSingleNode('/Solution/Folder[@Name="/tests/"]')
            if ($null -eq $testsFolder) {
              $testsFolder = $doc.CreateElement('Folder')
              $testsFolder.SetAttribute('Name', '/tests/')
              $doc.DocumentElement.AppendChild($testsFolder) | Out-Null
            }
            $addSolutionProject = {
              param($parent, [string]$projectPath, [string[]]$platforms)
              if ($doc.SelectSingleNode("//Project[@Path='$projectPath']") -ne $null) { return }
              $projectNode = $doc.CreateElement('Project')
              $projectNode.SetAttribute('Path', $projectPath)
              foreach ($platform in $platforms) {
                $projectPlatform = $doc.CreateElement('Platform')
                switch ($platform) {
                  'arm64' { $projectPlatform.SetAttribute('Solution', '*|arm64'); $projectPlatform.SetAttribute('Project', 'ARM64') }
                  'x64'   { $projectPlatform.SetAttribute('Solution', '*|x64');   $projectPlatform.SetAttribute('Project', 'x64') }
                  'x86'   { $projectPlatform.SetAttribute('Solution', '*|x86');   $projectPlatform.SetAttribute('Project', 'x86') }
                }
                $projectNode.AppendChild($projectPlatform) | Out-Null
              }
              $parent.AppendChild($projectNode) | Out-Null
            }
            & $addSolutionProject $libsFolder 'src/Wino.Mail.BackgroundSyncHost/Wino.Mail.BackgroundSyncHost.csproj' @('arm64','x64','x86')
            & $addSolutionProject $testsFolder 'tests/Wino.NotificationHost.Tests/Wino.NotificationHost.Tests.csproj' @('x64')
            & $addSolutionProject $testsFolder 'tests/Wino.Services.AotSmoke/Wino.Services.AotSmoke.csproj' @('x64')
            $doc.Save((Resolve-Path -LiteralPath $solutionPath).Path)
            git add -- $solutionPath
            if ($LASTEXITCODE -ne 0) { throw 'Could not stage resolved feature project entries in WinoMail.slnx.' }
            [void]$conflicts.Remove('WinoMail.slnx')
            Write-Host 'Resolved WinoMail.slnx: restored main projects retained; only background host and feature test projects added.'
          }

          # The current main App.xaml.cs is authoritative; port only background-host launch and close semantics.
          $appPath = 'src/Wino.Mail.WinUI/App.xaml.cs'
          git checkout $env:PORT_MAIN_SHA -- $appPath
          if ($LASTEXITCODE -ne 0) { throw 'Could not restore main App.xaml.cs before porting the BackgroundSyncHost entry point.' }
          $appText = Get-Content -LiteralPath $appPath -Raw
          if ($appText -notmatch '(?m)^using System\.Diagnostics;') {
            $usingAnchor = 'using System.Collections.Generic;'
            if (-not $appText.Contains($usingAnchor)) { throw 'Could not locate the App.xaml.cs using section.' }
            $appText = $appText.Replace($usingAnchor, $usingAnchor + [Environment]::NewLine + 'using System.Diagnostics;')
          }
          $semaphoreAnchor = '    private readonly SemaphoreSlim _appHostInfrastructureSemaphore = new(1, 1);'
          if ($appText -notmatch '_backgroundSyncHostLaunchSemaphore') {
            if (-not $appText.Contains($semaphoreAnchor)) { throw 'Could not locate the app-host semaphore declaration.' }
            $appText = $appText.Replace($semaphoreAnchor, $semaphoreAnchor + [Environment]::NewLine + '    private readonly SemaphoreSlim _backgroundSyncHostLaunchSemaphore = new(1, 1);')
          }

          $noTrayBlock = @(
            '        if (closeBehavior == AppCloseBehavior.RunInBackgroundWithoutTrayIcon)',
            '        {',
            '            DisposeTrayIcon();',
            '            LogActivation("Background shell close prepared without a system tray icon.");',
            '            return true;',
            '        }'
          ) -join [Environment]::NewLine
          $noTrayReplacement = @(
            '        if (closeBehavior == AppCloseBehavior.RunInBackgroundWithoutTrayIcon)',
            '        {',
            '            DisposeTrayIcon();',
            '            ReleaseBackgroundLifetimeWindow();',
            '            LogActivation("Background shell close prepared without a system tray icon; WinUI process may terminate.");',
            '            return true;',
            '        }'
          ) -join [Environment]::NewLine
          if ($appText.Contains($noTrayBlock)) {
            $appText = $appText.Replace($noTrayBlock, $noTrayReplacement)
          } elseif ($appText -notmatch 'Background shell close prepared without a system tray icon; WinUI process may terminate\.') {
            throw 'Could not port the no-tray close behavior to allow WinUI process exit.'
          }

          $accountAnchor = '            _hasConfiguredAccounts = (await _accountService.GetAccountsAsync()).Any();'
          if ($appText.Contains($accountAnchor) -and $appText -notmatch '_ = StartBackgroundSyncHostIfNeededAsync\(\);') {
            $accountReplacement = $accountAnchor + [Environment]::NewLine + '            if (_hasConfiguredAccounts)' + [Environment]::NewLine + '                _ = StartBackgroundSyncHostIfNeededAsync();'
            $appText = $appText.Replace($accountAnchor, $accountReplacement)
          }
          $appText = [regex]::Replace($appText, '(?m)^([ \t]*)_hasConfiguredAccounts = true;\s*$', { param($m) $m.Groups[1].Value + '_hasConfiguredAccounts = true;' + [Environment]::NewLine + $m.Groups[1].Value + '_ = StartBackgroundSyncHostIfNeededAsync();' })

          if ($appText -notmatch 'internal async Task<bool> StartBackgroundSyncHostIfNeededAsync\(') {
            $methodAnchor = '    private bool TryMarkInitialNotificationActivationHandled()'
            if (-not $appText.Contains($methodAnchor)) { throw 'Could not locate the App.xaml.cs insertion point for BackgroundSyncHost launch methods.' }
            $hostMethods = @(
              '    internal async Task<bool> StartBackgroundSyncHostIfNeededAsync()',
              '    {',
              '        var preferences = _preferencesService ?? Services.GetService<IPreferencesService>();',
              '        if (preferences?.AppCloseBehavior == AppCloseBehavior.Terminate)',
              '            return true;',
              '',
              '        if (IsBackgroundSyncHostRunning())',
              '            return true;',
              '',
              '        await _backgroundSyncHostLaunchSemaphore.WaitAsync().ConfigureAwait(true);',
              '        try',
              '        {',
              '            if (IsBackgroundSyncHostRunning())',
              '                return true;',
              '',
              '            await LaunchBackgroundSyncHostAsync().ConfigureAwait(true);',
              '            return true;',
              '        }',
              '        catch (Exception exception)',
              '        {',
              '            Log.Error(exception, "Failed to start the BackgroundSyncHost.");',
              '            return false;',
              '        }',
              '        finally',
              '        {',
              '            _backgroundSyncHostLaunchSemaphore.Release();',
              '        }',
              '    }',
              '',
              '    private static bool IsBackgroundSyncHostRunning()',
              '    {',
              '        try',
              '        {',
              '            return Process.GetProcessesByName("Wino.Mail.BackgroundSyncHost").Length > 0;',
              '        }',
              '        catch',
              '        {',
              '            return false;',
              '        }',
              '    }',
              '',
              '    private static async Task LaunchBackgroundSyncHostAsync()',
              '    {',
              '        var appUserModelId = $"{Windows.ApplicationModel.Package.Current.Id.FamilyName}!BackgroundSyncHost";',
              '        var processId = await Task.Run(() => PackagedApplicationActivator.Activate(appUserModelId, string.Empty))',
              '            .WaitAsync(TimeSpan.FromSeconds(15))',
              '            .ConfigureAwait(true);',
              '',
              '        if (processId == 0)',
              '            throw new InvalidOperationException("BackgroundSyncHost activation returned process id 0.");',
              '    }',
              ''
            ) -join [Environment]::NewLine
            $appText = $appText.Replace($methodAnchor, $hostMethods + $methodAnchor)
          }
          Set-Content -LiteralPath $appPath -Value $appText -NoNewline
          git add -- $appPath
          if ($LASTEXITCODE -ne 0) { throw 'Could not stage main-based App.xaml.cs with background host activation.' }
          Write-Host 'Ported BackgroundSyncHost startup and process-exit behavior without importing legacy in-app sync loops.'
          # Resolve the application project by preserving main's unified notification-host pipeline and adding only BackgroundSyncHost.
          if ($conflicts.Contains('src/Wino.Mail.WinUI/Wino.Mail.WinUI.csproj')) {
            $projectPath = 'src/Wino.Mail.WinUI/Wino.Mail.WinUI.csproj'
            git checkout $env:PORT_MAIN_SHA -- $projectPath
            if ($LASTEXITCODE -ne 0) { throw 'Could not restore main Wino.Mail.WinUI.csproj before applying the background host target.' }
            $projectText = Get-Content -LiteralPath $projectPath -Raw
            $hostProjectReference = '<ProjectReference Include="..\Wino.Mail.BackgroundSyncHost\Wino.Mail.BackgroundSyncHost.csproj" ReferenceOutputAssembly="false" Private="false" />'
            if ($projectText -notmatch 'Wino\.Mail\.BackgroundSyncHost\.csproj') {
              $endProjectTag = $projectText.LastIndexOf('</Project>', [StringComparison]::Ordinal)
              if ($endProjectTag -lt 0) { throw 'Could not find Wino.Mail.WinUI project end tag.' }
              $referenceGroup = '  <ItemGroup>' + [Environment]::NewLine + '    ' + $hostProjectReference + [Environment]::NewLine + '  </ItemGroup>' + [Environment]::NewLine
              $projectText = $projectText.Insert($endProjectTag, $referenceGroup)
            }

            if ($projectText -notmatch '<BackgroundSyncHostOutput>') {
              $publishRootTag = '</NotificationHostPublishRoot>'
              $publishRootEnd = $projectText.IndexOf($publishRootTag, [StringComparison]::Ordinal)
              if ($publishRootEnd -lt 0) { throw 'Could not find NotificationHostPublishRoot in main Wino.Mail.WinUI.csproj.' }
              $propertyEnd = $publishRootEnd + $publishRootTag.Length
              $backgroundOutput = [Environment]::NewLine + '    <BackgroundSyncHostOutput>$(MSBuildProjectDirectory)\..\Wino.Mail.BackgroundSyncHost\bin\$(Platform)\$(Configuration)\net10.0-windows10.0.26100.0\$(RuntimeIdentifier)\publish\</BackgroundSyncHostOutput>'
              $projectText = $projectText.Insert($propertyEnd, $backgroundOutput)
            }

            if ($projectText -notmatch 'Target Name="PublishBackgroundSyncHost"') {
              $targetAnchor = '  <Target Name="PublishNotificationHost"'
              $targetIndex = $projectText.IndexOf($targetAnchor, [StringComparison]::Ordinal)
              if ($targetIndex -lt 0) { throw 'Could not find main PublishNotificationHost target.' }
              $backgroundTarget = @(
                '  <Target Name="PublishBackgroundSyncHost" BeforeTargets="PrepareForBuild">',
                '    <MSBuild',
                '      Projects="$(MSBuildProjectDirectory)\..\Wino.Mail.BackgroundSyncHost\Wino.Mail.BackgroundSyncHost.csproj"',
                '      Targets="Restore;Publish"',
                '      Properties="Configuration=$(Configuration);Platform=$(Platform);RuntimeIdentifier=$(RuntimeIdentifier);SelfContained=true;PublishSingleFile=false;PublishTrimmed=false;PublishAot=false;WindowsAppSDKSelfContained=true;GenerateAppxPackageOnBuild=false;WindowsPackageType=None;PublishDir=$(BackgroundSyncHostOutput)" />',
                '    <ItemGroup>',
                '      <BackgroundSyncHostContent Include="$(BackgroundSyncHostOutput)**\*" />',
                '      <Content Include="@(BackgroundSyncHostContent)" CopyToOutputDirectory="PreserveNewest" CopyToPublishDirectory="PreserveNewest" Link="BackgroundSyncHost\%(RecursiveDir)%(Filename)%(Extension)" />',
                '    </ItemGroup>',
                '  </Target>',
                ''
              ) -join [Environment]::NewLine
              $projectText = $projectText.Insert($targetIndex, $backgroundTarget)
            }
            Set-Content -LiteralPath $projectPath -Value $projectText -NoNewline
            git add -- $projectPath
            if ($LASTEXITCODE -ne 0) { throw 'Could not stage main-compatible BackgroundSyncHost packaging changes.' }
            [void]$conflicts.Remove($projectPath)
            Write-Host "Resolved WinUI project by preserving main's unified host and adding only BackgroundSyncHost packaging support."
          }

          # Keep the platform project free of WinUI app-layer source files to avoid duplicate type conflicts.
          $platformProjectPath = 'src/Wino.Platform.Windows/Wino.Platform.Windows.csproj'
          $platformText = Get-Content -LiteralPath $platformProjectPath -Raw
          $coreReference = '<ProjectReference Include="..\Wino.Core.Domain\Wino.Core.Domain.csproj" />'
          if (-not $platformText.Contains('Wino.NotificationHost.Contracts.csproj')) {
            if (-not $platformText.Contains($coreReference)) { throw 'Could not locate the platform core-domain project reference.' }
            $contractReference = '<ProjectReference Include="..\Wino.NotificationHost.Contracts\Wino.NotificationHost.Contracts.csproj" />'
            $platformText = $platformText.Replace($coreReference, $coreReference + [Environment]::NewLine + '    ' + $contractReference)
          }
          if (-not $platformText.Contains('Wino.Services.csproj')) {
            $platformText = $platformText.Replace($coreReference, $coreReference + [Environment]::NewLine + '    <ProjectReference Include="..\Wino.Services\Wino.Services.csproj" />')
          }
          if ($platformText -notmatch 'CommunityToolkit\.Mvvm') {
            $projectItemAnchor = '<ItemGroup>'
            $firstItemIndex = $platformText.IndexOf($projectItemAnchor, [StringComparison]::Ordinal)
            if ($firstItemIndex -lt 0) { throw 'Could not locate a platform project item group.' }
            $platformText = $platformText.Insert($firstItemIndex + $projectItemAnchor.Length, [Environment]::NewLine + '    <PackageReference Include="CommunityToolkit.Mvvm" />')
          }
          if ($platformText -notmatch '<RuntimeIdentifiers>') {
            $platformText = $platformText.Replace('<Platforms>x86;x64;arm64</Platforms>', '<Platforms>x86;x64;arm64</Platforms>' + [Environment]::NewLine + '    <RuntimeIdentifiers>win-x86;win-x64;win-arm64</RuntimeIdentifiers>')
          }
          Set-Content -LiteralPath $platformProjectPath -Value $platformText -NoNewline
          git add -- $platformProjectPath
          if ($LASTEXITCODE -ne 0) { throw 'Could not stage the platform notification contract references.' }

          # Compile the two app-layer runtime services into the background executable only.
          $hostProjectPath = 'src/Wino.Mail.BackgroundSyncHost/Wino.Mail.BackgroundSyncHost.csproj'
          $hostProjectText = Get-Content -LiteralPath $hostProjectPath -Raw
          if ($hostProjectText -notmatch 'Link="Services\\ConfigurationService\.cs"') {
            $hostCompileItems = @(
              '  <ItemGroup>',
              '    <Compile Include="..\Wino.Mail.WinUI\Services\ConfigurationService.cs" Link="Services\ConfigurationService.cs" />',
              '    <Compile Include="..\Wino.Mail.WinUI\Services\ShellUserPresenceStateProvider.cs" Link="Services\ShellUserPresenceStateProvider.cs" />',
              '  </ItemGroup>',
              ''
            ) -join [Environment]::NewLine
            $projectEnd = $hostProjectText.LastIndexOf('</Project>', [StringComparison]::Ordinal)
            if ($projectEnd -lt 0) { throw 'Could not find BackgroundSyncHost project end tag.' }
            $hostProjectText = $hostProjectText.Insert($projectEnd, $hostCompileItems)
            Set-Content -LiteralPath $hostProjectPath -Value $hostProjectText -NoNewline
            git add -- $hostProjectPath
            if ($LASTEXITCODE -ne 0) { throw 'Could not stage app-layer service links in BackgroundSyncHost.csproj.' }
          }
          # Rebuild the manifest from restored main, then add only BackgroundSyncHost.
          # This deliberately excludes the obsolete four hidden NotificationHost application identities.
          $manifestPath = 'src/Wino.Mail.WinUI/Package.appxmanifest'
          git checkout $env:PORT_MAIN_SHA -- $manifestPath
          if ($LASTEXITCODE -ne 0) { throw 'Could not restore main package manifest before adding BackgroundSyncHost.' }
          $sourceManifestText = (git show ($env:PORT_INTEGRATION_SHA + ':src/Wino.Mail.WinUI/Package.appxmanifest') | Out-String)
          $backgroundAppMatch = [regex]::Match($sourceManifestText, '(?s)<Application Id="BackgroundSyncHost".*?</Application>')
          if (-not $backgroundAppMatch.Success) { throw 'Could not find the feature BackgroundSyncHost application entry.' }
          $manifestText = Get-Content -LiteralPath $manifestPath -Raw
          $appsClose = $manifestText.LastIndexOf('</Applications>', [StringComparison]::Ordinal)
          if ($appsClose -lt 0) { throw 'Could not find Applications element in the main package manifest.' }
          $manifestText = $manifestText.Insert($appsClose, [Environment]::NewLine + '    ' + $backgroundAppMatch.Value + [Environment]::NewLine + '  ')
          Set-Content -LiteralPath $manifestPath -Value $manifestText -NoNewline
          git add -- $manifestPath
          if ($LASTEXITCODE -ne 0) { throw 'Could not stage the main-compatible BackgroundSyncHost package manifest.' }

          # Three additional conflicts are old implementations superseded by main's current single-host/release model.
          # Preserve main's authoritative versions; the background host uses the new shared toast dispatcher instead.
          foreach ($mainAuthoritativePath in @(
            'scripts/release/build-releases.ps1',
            'src/Wino.Mail.WinUI/Services/NotificationHostClient.cs',
            'src/Wino.NotificationHost/Program.cs'
          )) {
            if ($conflicts.Contains($mainAuthoritativePath)) {
              git checkout $env:PORT_MAIN_SHA -- $mainAuthoritativePath
              if ($LASTEXITCODE -ne 0) { throw "Could not preserve main's authoritative '$mainAuthoritativePath'." }
              git add -- $mainAuthoritativePath
              if ($LASTEXITCODE -ne 0) { throw "Could not stage main's authoritative '$mainAuthoritativePath'." }
              [void]$conflicts.Remove($mainAuthoritativePath)
              Write-Host "Resolved obsolete implementation conflict by preserving main: $mainAuthoritativePath"
            }
          }

          if ($conflicts.Count -gt 0) {
            "### Three-way merge conflicts ($($conflicts.Count))" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
            $conflicts | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
            foreach ($conflictPath in $conflicts) {
              Write-Host "---- Conflict preview: $conflictPath ----"
              Select-String -LiteralPath $conflictPath -Pattern '^<<<<<<< |^=======$|^>>>>>>> ' -Context 1,1 | ForEach-Object { Write-Host $_.ToString() }
            }
            git add -A
            git -c user.name='Snn1452' -c user.email='snn1452@gmail.com' commit -m "Diagnostic feature-only port with explicit merge conflicts"
            if ($LASTEXITCODE -ne 0) { throw 'Could not preserve diagnostic conflict tree.' }
            git push --force origin 'HEAD:refs/heads/automation/pr4-port-conflicts-20261010'
            if ($LASTEXITCODE -ne 0) { throw 'Could not persist diagnostic conflict tree.' }
            throw "Feature-only port has $($conflicts.Count) textual conflicts. Diagnostic snapshot was kept off the PR branch."
          }

          # Normalize whitespace only in the added runtime workflow; preserve all code and other files unchanged.
          $runtimeWorkflowPath = '.github/workflows/background-notification-runtime.yml'
          $runtimeWorkflowText = Get-Content -LiteralPath $runtimeWorkflowPath -Raw
          $spaceChars = [char[]]@([char]32, [char]9)
          $runtimeWorkflowLines = @($runtimeWorkflowText -split "\r?\n" | ForEach-Object { $_.TrimEnd($spaceChars) })
          $runtimeWorkflowText = ($runtimeWorkflowLines -join [Environment]::NewLine).TrimEnd([char[]]@([char]13, [char]10)) + [Environment]::NewLine
          Set-Content -LiteralPath $runtimeWorkflowPath -Value $runtimeWorkflowText -NoNewline
          git add -- $runtimeWorkflowPath
          if ($LASTEXITCODE -ne 0) { throw 'Could not stage whitespace cleanup for the runtime workflow.' }
          $manifestWhitespacePath = 'src/Wino.Mail.WinUI/Package.appxmanifest'
          $manifestLines = @(Get-Content -LiteralPath $manifestWhitespacePath | ForEach-Object { $_.TrimEnd($spaceChars) })
          Set-Content -LiteralPath $manifestWhitespacePath -Value ($manifestLines -join [Environment]::NewLine) -NoNewline
          git add -- $manifestWhitespacePath
          if ($LASTEXITCODE -ne 0) { throw 'Could not stage package manifest whitespace cleanup.' }

          git add -A
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { throw 'Feature-only port contains whitespace errors.' }
          "Three-way feature-only port merged without textual conflicts." | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Bind the background host to main's compatible service contracts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $hostProjectPath = 'src/Wino.Mail.BackgroundSyncHost/Wino.Mail.BackgroundSyncHost.csproj'
          $hostProjectText = Get-Content -LiteralPath $hostProjectPath -Raw
          if ($hostProjectText -notmatch 'Wino\.Core\.ViewModels\.csproj') {
            $coreProjectReference = '<ProjectReference Include="..\Wino.Core\Wino.Core.csproj" />'
            if (-not $hostProjectText.Contains($coreProjectReference)) { throw 'Could not locate BackgroundSyncHost Wino.Core reference.' }
            $viewModelsReference = '<ProjectReference Include="..\Wino.Core.ViewModels\Wino.Core.ViewModels.csproj" />'
            $hostProjectText = $hostProjectText.Replace($coreProjectReference, $coreProjectReference + [Environment]::NewLine + '    ' + $viewModelsReference)
            Set-Content -LiteralPath $hostProjectPath -Value $hostProjectText -NoNewline
            git add -- $hostProjectPath
            if ($LASTEXITCODE -ne 0) { throw 'Could not stage the Wino.Core.ViewModels reference.' }
          }
          # Ensure the executable is self-contained when built directly from the solution as well as through WinUI.
          $hostPropertiesChanged = $false
          $hostProjectText = $hostProjectText.Replace('<SelfContained>false</SelfContained>', '<SelfContained>true</SelfContained>')
          if ($hostProjectText -notmatch '<RuntimeIdentifier Condition=') {
            $runtimeIdentifiersAnchor = '<RuntimeIdentifiers>win-x86;win-x64;win-arm64</RuntimeIdentifiers>'
            if (-not $hostProjectText.Contains($runtimeIdentifiersAnchor)) { throw 'Could not locate BackgroundSyncHost RuntimeIdentifiers property.' }
            $runtimeDefaults = @(
              '    <RuntimeIdentifier Condition="''$(RuntimeIdentifier)'' == '''' and ''$(Platform)'' == ''x86''">win-x86</RuntimeIdentifier>',
              '    <RuntimeIdentifier Condition="''$(RuntimeIdentifier)'' == '''' and ''$(Platform)'' == ''x64''">win-x64</RuntimeIdentifier>',
              '    <RuntimeIdentifier Condition="''$(RuntimeIdentifier)'' == '''' and ''$(Platform)'' == ''ARM64''">win-arm64</RuntimeIdentifier>'
            ) -join [Environment]::NewLine
            $hostProjectText = $hostProjectText.Replace($runtimeIdentifiersAnchor, $runtimeIdentifiersAnchor + [Environment]::NewLine + $runtimeDefaults)
          }
          Set-Content -LiteralPath $hostProjectPath -Value $hostProjectText -NoNewline
          git add -- $hostProjectPath
          if ($LASTEXITCODE -ne 0) { throw 'Could not stage self-contained BackgroundSyncHost runtime properties.' }
          Write-Host 'BackgroundSyncHost now defaults to a self-contained executable with the platform-specific RuntimeIdentifier.'

          # Main's unified notification COM host remains authoritative. Do not retain the old per-request host entry point from integration.
          $notificationProgramPath = 'src/Wino.NotificationHost/Program.cs'
          git checkout $env:PORT_MAIN_SHA -- $notificationProgramPath
          if ($LASTEXITCODE -ne 0) { throw 'Could not restore the unified NotificationHost entry point from main.' }
          git add -- $notificationProgramPath
          if ($LASTEXITCODE -ne 0) { throw 'Could not stage the unified NotificationHost entry point.' }
          # Keep the current manifest application IDs authoritative for COM toast activation.
          $applicationIdsPath = 'src/Wino.NotificationHost.Contracts/NotificationHostApplicationIds.cs'
          git checkout $env:PORT_MAIN_SHA -- $applicationIdsPath
          if ($LASTEXITCODE -ne 0) { throw 'Could not restore the current notification application ID mapping.' }
          $applicationIdsText = Get-Content -LiteralPath $applicationIdsPath -Raw
          if ($applicationIdsText -notmatch 'GetToastTargetApplicationId') {
            $applicationIdsAnchor = '    public static bool TryResolveFromAppUserModelId'
            if (-not $applicationIdsText.Contains($applicationIdsAnchor)) { throw 'Could not find the application ID resolver insertion point.' }
            $toastTargetMethod = '    public static string GetToastTargetApplicationId(NotificationHostApplication application)' + [Environment]::NewLine + '        => GetApplicationId(application);' + [Environment]::NewLine + [Environment]::NewLine
            $applicationIdsText = $applicationIdsText.Replace($applicationIdsAnchor, $toastTargetMethod + $applicationIdsAnchor)
            Set-Content -LiteralPath $applicationIdsPath -Value $applicationIdsText -NoNewline
          }
          git add -- $applicationIdsPath
          if ($LASTEXITCODE -ne 0) { throw 'Could not stage current notification application IDs with the toast target helper.' }
          Write-Host 'Kept the unified notification host entry point and AUMID map; added the legacy service contract and a compatible toast target helper.'

      - name: Use the current packaged toast dispatcher for background notifications
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $clientPath = 'src/Wino.Mail.BackgroundSyncHost/BackgroundNotificationHostClient.cs'
          $clientLines = @(
            'using System;',
            'using System.Threading;',
            'using System.Threading.Tasks;',
            'using Wino.NotificationHost.Contracts;',
            'using Wino.Platform.Windows;',
            '',
            'namespace Wino.Mail.BackgroundSyncHost;',
            '',
            'internal sealed class BackgroundNotificationHostClient',
            '{',
            '    public Task ShowAsync(',
            '        NotificationHostApplication application,',
            '        string payload,',
            '        string? tag = null,',
            '        string? group = null,',
            '        CancellationToken cancellationToken = default)',
            '        => NotificationHostDispatcher.ShowAsync(application, payload, tag, group, cancellationToken);',
            '',
            '    public Task RemoveByTagAsync(',
            '        NotificationHostApplication application,',
            '        string tag,',
            '        CancellationToken cancellationToken = default)',
            '        => NotificationHostDispatcher.RemoveByTagAsync(application, tag, cancellationToken);',
            '',
            '    public async Task ShowAndWaitForSmokeAsync(',
            '        NotificationHostApplication application,',
            '        string payload,',
            '        string tag,',
            '        CancellationToken cancellationToken = default)',
            '    {',
            '        await NotificationHostDispatcher.ShowAsync(application, payload, tag, cancellationToken: cancellationToken)',
            '            .ConfigureAwait(false);',
            '',
            '        var shown = await NotificationHostDispatcher.WaitForNotificationAsync(',
            '                application,',
            '                tag,',
            '                TimeSpan.FromSeconds(15),',
            '                cancellationToken)',
            '            .ConfigureAwait(false);',
            '',
            '        if (!shown)',
            '            throw new TimeoutException($"Windows notification history did not record smoke tag {tag}.");',
            '    }',
            '}'
          )
          $clientText = ($clientLines -join [Environment]::NewLine) + [Environment]::NewLine
          $clientText = (($clientText -split "`r?`n") | ForEach-Object { $_.TrimStart() }) -join [Environment]::NewLine
          Set-Content -LiteralPath $clientPath -Value $clientText -NoNewline
          git add -- $clientPath
          if ($LASTEXITCODE -ne 0) { throw 'Could not stage the BackgroundNotificationHostClient modern dispatch implementation.' }
          Write-Host 'Background notifications now use main-compatible AUMIDs and the shared toast dispatcher.'

      - name: Fix WinRT AOT collection types and drop legacy supervisor tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Get-IndexOfLine {
            param([System.Collections.Generic.List[string]]$Lines, [int]$Start, [string]$Contains, [int]$Limit = -1)
            if ($Limit -lt 0 -or $Limit -gt $Lines.Count) { $Limit = $Lines.Count }
            for ($index = $Start; $index -lt $Limit; $index++) {
              if ($Lines[$index].Contains($Contains)) { return $index }
            }
            return -1
          }
          function Replace-ArrayArgument {
            param([System.Collections.Generic.List[string]]$Lines, [int]$Start, [int]$Limit, [string]$ArrayType)
            $open = -1
            for ($index = $Start; $index -lt $Limit; $index++) { if ($Lines[$index].Trim() -eq '[') { $open = $index; break } }
            if ($open -lt 0) { return @{ Next = $Start; Found = $false } }
            $close = -1
            for ($index = $open + 1; $index -lt $Limit; $index++) { if ($Lines[$index].Trim() -eq '],') { $close = $index; break } }
            if ($close -lt 0) { throw "Could not find collection-expression end after line $($open + 1)." }
            $indent = $Lines[$open].Substring(0, $Lines[$open].Length - $Lines[$open].TrimStart().Length)
            $Lines[$open] = $indent + $ArrayType + ' {'
            $Lines[$close] = $Lines[$close].Replace('],', '},')
            return @{ Next = $close + 1; Found = $true }
          }

          $programPath = 'src/Wino.Mail.BackgroundSyncHost/Program.cs'
          $programLines = [System.Collections.Generic.List[string]]::new()
          foreach ($line in (Get-Content -LiteralPath $programPath)) { $programLines.Add($line) }
          $smokeBuild = Get-IndexOfLine $programLines 0 'var smokePayload = HeadlessNotificationPayloadBuilder.Build('
          if ($smokeBuild -lt 0) { throw 'Could not locate BackgroundSyncHost notification smoke payload.' }
          $first = Replace-ArrayArgument $programLines ($smokeBuild + 1) $programLines.Count 'new string[]'
          if (-not $first.Found) { throw 'Could not convert the notification smoke text collection.' }
          $second = Replace-ArrayArgument $programLines $first.Next $programLines.Count 'new (string Content, System.Collections.Generic.IReadOnlyDictionary<string, string> Arguments)[]'
          if (-not $second.Found) { throw 'Could not convert the notification smoke button collection.' }
          Set-Content -LiteralPath $programPath -Value ($programLines -join [Environment]::NewLine) -NoNewline
          git add -- $programPath
          if ($LASTEXITCODE -ne 0) { throw 'Could not stage BackgroundSyncHost WinRT collection fixes.' }

          $builderPath = 'src/Wino.Mail.BackgroundSyncHost/HeadlessNotificationBuilder.cs'
          $builderLines = [System.Collections.Generic.List[string]]::new()
          foreach ($line in (Get-Content -LiteralPath $builderPath)) { $builderLines.Add($line) }
          $buildIndices = [System.Collections.Generic.List[int]]::new()
          for ($index = 0; $index -lt $builderLines.Count; $index++) {
            if ($builderLines[$index].Contains('HeadlessNotificationPayloadBuilder.Build(')) { $buildIndices.Add($index) }
          }
          foreach ($buildIndex in $buildIndices) {
            $limit = Get-IndexOfLine $builderLines ($buildIndex + 1) 'HeadlessNotificationPayloadBuilder.Build('
            if ($limit -lt 0) { $limit = $builderLines.Count }
            $texts = Replace-ArrayArgument $builderLines ($buildIndex + 1) $limit 'new string[]'
            if ($texts.Found) {
              $buttons = Replace-ArrayArgument $builderLines $texts.Next $limit 'new (string Content, System.Collections.Generic.IReadOnlyDictionary<string, string> Arguments)[]'
            }
          }
          Set-Content -LiteralPath $builderPath -Value ($builderLines -join [Environment]::NewLine) -NoNewline
          git add -- $builderPath
          if ($LASTEXITCODE -ne 0) { throw 'Could not stage headless notification WinRT collection fixes.' }

          $testProject = 'tests/Wino.NotificationHost.Tests/Wino.NotificationHost.Tests.csproj'
          $testProjectText = Get-Content -LiteralPath $testProject -Raw
          $legacyCompileLine = '(?m)^\s*<Compile Include="\.\.\\\.\.\\src\\Wino\.Mail\.WinUI\\Services\\NotificationHostProcessSupervisor\.cs"[^\r\n]*\r?\n'
          $testProjectText = [regex]::Replace($testProjectText, $legacyCompileLine, '')
          Set-Content -LiteralPath $testProject -Value $testProjectText -NoNewline
          Remove-Item -LiteralPath 'tests/Wino.NotificationHost.Tests/NotificationHostProcessSupervisorTests.cs' -Force -ErrorAction SilentlyContinue
          git add -A
          if ($LASTEXITCODE -ne 0) { throw 'Could not stage removal of the superseded notification supervisor test.' }
          Write-Host 'Replaced CsWinRT1032 collection expressions with explicit arrays and removed the test for the deleted legacy supervisor.'

      - name: Fix self-contained host reference and retire superseded protocol tests
        shell: pwsh
