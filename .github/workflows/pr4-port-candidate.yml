      - name: Build and validate signed Beta MSIXBundle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $profile = Get-Content -LiteralPath 'scripts/release/profiles/Beta.json' -Raw | ConvertFrom-Json
          $outputRoot = Join-Path $env:GITHUB_WORKSPACE 'src/Wino.Mail.WinUI/AppPackages'
          New-Item -ItemType Directory -Force -Path $outputRoot | Out-Null
          $env:WINO_RELEASES_ROOT = $outputRoot
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject $profile.Publisher -KeyAlgorithm RSA -KeyLength 2048 -HashAlgorithm SHA256 -CertStoreLocation 'Cert:\CurrentUser\My' -KeyExportPolicy Exportable -NotAfter (Get-Date).AddDays(7)
          if ($null -eq $cert -or -not $cert.HasPrivateKey) { throw 'Could not create the Beta test signing certificate.' }
          "CERT_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV
          pwsh -NoProfile -File tests/scripts/Build-Beta-TestBundle.ps1 -CertificateThumbprint $cert.Thumbprint -BetaAssetsPath release-assets/Beta
          if ($LASTEXITCODE -ne 0) { throw 'Beta MSIXBundle build failed.' }

          $releaseDirs = @(Get-ChildItem -LiteralPath $outputRoot -Directory -Filter 'WinoMail_Beta_*' | Sort-Object LastWriteTime -Descending)
          if ($releaseDirs.Count -ne 1) { throw "Expected exactly one Beta release directory, found $($releaseDirs.Count)." }
          $releaseDir = $releaseDirs[0].FullName
          $bundle = Join-Path $releaseDir ($releaseDirs[0].Name + '.msixbundle')
          $certificate = Join-Path $releaseDir 'WinoMail_Beta_TestCertificate.cer'
          if (-not (Test-Path -LiteralPath $bundle -PathType Leaf)) { throw "Beta MSIXBundle missing: $bundle" }
          if (-not (Test-Path -LiteralPath $certificate -PathType Leaf)) { throw "Beta certificate missing: $certificate" }

          $signature = Get-AuthenticodeSignature -LiteralPath $bundle
          if ($null -eq $signature.SignerCertificate -or $signature.SignerCertificate.Thumbprint -cne $cert.Thumbprint) { throw 'Beta bundle signature does not match the generated certificate.' }
          "BUNDLE_PATH=$bundle" >> $env:GITHUB_ENV
          "CERTIFICATE_PATH=$certificate" >> $env:GITHUB_ENV
          "BETA_RELEASE_DIR=$releaseDir" >> $env:GITHUB_ENV
          "Validated signed Beta MSIXBundle: $bundle" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "Beta certificate thumbprint: $($cert.Thumbprint)" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Install Beta and test background runtime plus close behavior
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Certificate -FilePath $env:CERTIFICATE_PATH -CertStoreLocation 'Cert:\LocalMachine\TrustedPeople' -ErrorAction Stop | Out-Null
          Add-AppxPackage -Path $env:BUNDLE_PATH -ForceApplicationShutdown -ErrorAction Stop

          $package = Get-AppxPackage -Name 'WinoMail.Beta' -ErrorAction Stop
          $manifest = Get-AppxPackageManifest $package
          if ([string]$manifest.Package.Identity.Name -cne 'WinoMail.Beta') { throw 'Installed package identity mismatch.' }
          $backgroundHostPath = Join-Path $package.InstallLocation 'BackgroundSyncHost\Wino.Mail.BackgroundSyncHost.exe'
          if (-not (Test-Path -LiteralPath $backgroundHostPath -PathType Leaf)) { throw 'Packaged BackgroundSyncHost executable is missing.' }
          $targetAumid = "$($package.PackageFamilyName)!App"

          # Toast/notification path with the UI visibly open.
          Start-Process -FilePath "$env:WINDIR\explorer.exe" -ArgumentList "shell:AppsFolder\$targetAumid" | Out-Null
          $ui = $null
          for ($attempt = 0; $attempt -lt 30 -and $null -eq $ui; $attempt++) {
            Start-Sleep -Seconds 1
            $ui = Get-Process -Name 'Wino.Mail.WinUI' -ErrorAction SilentlyContinue | Where-Object { $_.MainWindowHandle -ne 0 } | Select-Object -First 1
          }
          if ($null -eq $ui) { throw 'Packaged Wino Mail UI did not open.' }
          $openSmoke = Start-Process -FilePath $backgroundHostPath -ArgumentList '--notification-smoke-test' -WorkingDirectory $package.InstallLocation -PassThru -Wait
          if ($openSmoke.ExitCode -ne 0) { throw "Background toast smoke with UI open failed: $($openSmoke.ExitCode)" }
          if ($ui.HasExited) { throw 'UI process exited during the open-window notification smoke.' }

          # Close with the actual no-tray preference marker, require process exit, then relaunch.
          $markerDirectory = Join-Path $env:LOCALAPPDATA "Packages\$($package.PackageFamilyName)\LocalState"
          New-Item -ItemType Directory -Force -Path $markerDirectory | Out-Null
          $markerPath = Join-Path $markerDirectory '.wino-close-behavior-smoke'
          Set-Content -LiteralPath $markerPath -Value 'RunInBackgroundWithoutTrayIcon' -NoNewline
          $firstPid = $ui.Id
          if (-not $ui.CloseMainWindow()) { throw "CloseMainWindow returned false for WinUI PID $firstPid." }
          if (-not $ui.WaitForExit(15000)) { throw "WinUI PID $firstPid did not exit for RunInBackgroundWithoutTrayIcon." }
          Start-Sleep -Seconds 2
          if (Get-Process -Id $firstPid -ErrorAction SilentlyContinue) { throw 'WinUI process still exists after expected close.' }

          Start-Process -FilePath "$env:WINDIR\explorer.exe" -ArgumentList "shell:AppsFolder\$targetAumid" | Out-Null
          $secondUi = $null
          for ($attempt = 0; $attempt -lt 30 -and $null -eq $secondUi; $attempt++) {
            Start-Sleep -Seconds 1
            $secondUi = Get-Process -Name 'Wino.Mail.WinUI' -ErrorAction SilentlyContinue | Where-Object { $_.MainWindowHandle -ne 0 } | Select-Object -First 1
          }
          if ($null -eq $secondUi -or $secondUi.Id -eq $firstPid) { throw 'Visible relaunch did not produce a new WinUI process.' }
          Stop-Process -Id $secondUi.Id -Force -ErrorAction SilentlyContinue

          # Background notification smoke with UI closed.
          $closedSmoke = Start-Process -FilePath $backgroundHostPath -ArgumentList '--notification-smoke-test' -WorkingDirectory $package.InstallLocation -PassThru -Wait
          if ($closedSmoke.ExitCode -ne 0) { throw "Background toast smoke with UI closed failed: $($closedSmoke.ExitCode)" }

          # Packaged activation by AUMID, independently of direct exe invocation.
          $hostAumid = "$($package.PackageFamilyName)!BackgroundSyncHost"
          $beforeIds = @(Get-Process -Name 'Wino.Mail.BackgroundSyncHost' -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Id)
          Start-Process -FilePath "$env:WINDIR\explorer.exe" -ArgumentList "shell:AppsFolder\$hostAumid" | Out-Null
          $newHost = $null
          for ($attempt = 0; $attempt -lt 20 -and $null -eq $newHost; $attempt++) {
            Start-Sleep -Seconds 1
            $newHost = Get-Process -Name 'Wino.Mail.BackgroundSyncHost' -ErrorAction SilentlyContinue | Where-Object { $beforeIds -notcontains $_.Id } | Select-Object -First 1
          }
          $diagnosticPaths = @(
            (Join-Path $env:LOCALAPPDATA 'Wino Mail/background-sync-host-startup.log'),
            (Join-Path $env:TEMP 'Wino Mail/background-sync-host-startup.log')
          )
          $diagnostics = ''
          foreach ($path in $diagnosticPaths) {
            if (Test-Path -LiteralPath $path -PathType Leaf) { $diagnostics += (Get-Content -LiteralPath $path -Raw) + [Environment]::NewLine }
          }
          if ([string]::IsNullOrWhiteSpace($diagnostics)) { throw "No BackgroundSyncHost diagnostic was produced after packaged activation through $hostAumid." }
          $failureLines = $diagnostics -split [Environment]::NewLine | Where-Object { $_ -match '\[FAIL\]' }
          if ($failureLines.Count -gt 0) { throw "BackgroundSyncHost reported a failure after package activation through $hostAumid." }
          if ($null -eq $newHost -and $diagnostics -notmatch '\[EXIT\].*code\s+0') { throw 'BackgroundSyncHost did not start or report a clean exit after packaged activation.' }
          if ($null -ne $newHost) { Stop-Process -Id $newHost.Id -Force -ErrorAction SilentlyContinue }
          "Beta install, notification smoke with UI open/closed, no-tray exit, relaunch, and packaged activation passed." | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Clean installed Beta package and test certificate
        if: always()
        shell: pwsh
        run: |
          Get-AppxPackage -Name 'WinoMail.Beta' -ErrorAction SilentlyContinue | ForEach-Object {
            Remove-AppxPackage -Package $_.PackageFullName -ErrorAction SilentlyContinue
          }
          if ($env:CERT_THUMBPRINT) {
            Get-ChildItem 'Cert:\LocalMachine\TrustedPeople' -ErrorAction SilentlyContinue | Where-Object Thumbprint -eq $env:CERT_THUMBPRINT | ForEach-Object { Remove-Item -LiteralPath "Cert:\LocalMachine\TrustedPeople\$($_.Thumbprint)" -Force -ErrorAction SilentlyContinue }
            Get-ChildItem 'Cert:\CurrentUser\My' -ErrorAction SilentlyContinue | Where-Object Thumbprint -eq $env:CERT_THUMBPRINT | ForEach-Object { Remove-Item -LiteralPath "Cert:\CurrentUser\My\$($_.Thumbprint)" -Force -ErrorAction SilentlyContinue }
          }

      - name: Persist verified feature-only port on temporary candidate ref
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Make the final source commit a direct child of restored main. The workflow exists only for this disposable validation branch.
          git reset --soft $env:PORT_MAIN_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Could not reset the final port commit onto restored main.' }
          if (Test-Path -LiteralPath '.github/workflows/pr4-port-candidate.yml') {
            Remove-Item -LiteralPath '.github/workflows/pr4-port-candidate.yml' -Force
          }
          git add -A
          if ($LASTEXITCODE -ne 0) { throw 'Could not stage the final port tree.' }
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { throw 'Final port tree contains whitespace errors.' }

          $changed = @(git diff --cached --name-only)
          if ($changed -contains '.github/workflows/pr4-port-candidate.yml') { throw 'Disposable validation workflow must not be included in the final feature patch.' }
          if ($changed.Count -gt 60) { throw "Final feature-only patch unexpectedly changes $($changed.Count) paths." }
          "Final feature-only tree paths ($($changed.Count)):" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          $changed | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append

          git commit -m "Port background sync runtime and startup layout onto restored main"
          if ($LASTEXITCODE -ne 0) { throw 'Could not commit the validated feature-only port.' }
          $parent = (git rev-parse HEAD^).Trim()
          if ($parent -cne $env:PORT_MAIN_SHA) { throw "Final port commit parent is not restored main: $parent" }
          $portSha = (git rev-parse HEAD).Trim()
          "PORT_COMMIT_SHA=$portSha" >> $env:GITHUB_ENV
          "Verified port commit: $portSha (direct parent: $parent)" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          git push --force origin "HEAD:refs/heads/automation/pr4-port-candidate-20261010"
          if ($LASTEXITCODE -ne 0) { throw 'Could not persist the verified feature-only candidate commit.' }
