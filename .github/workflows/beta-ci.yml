name: Beta CI and Release

on:
  push:
    branches:
      - integration/msix-release-upstream-main
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'build/**'
      - 'Directory.*'
      - 'WinoMail.slnx'
      - 'global.json'
      - 'nuget.config'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:


# Release-wide analyzers, tests, and SQLite AOT. WinUI AOT is built once in the MSIX job.

  native-aot:
    name: Verify Release compatibility and SQLite Native AOT
    runs-on: windows-latest
    timeout-minutes: 45
    concurrency:
      group: beta-validation-native-aot-${{ github.ref }}
      cancel-in-progress: true
    env:
      NUGET_CONFIG_PATH: ${{ github.workspace }}\nuget.config
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check installed .NET 10 SDK
        shell: pwsh
        run: |
          $hasCompatibleSdk = @(dotnet --list-sdks | Where-Object {
            if ($_ -match '^([0-9]+)\.([0-9]+)\.([0-9]+)\s') {
              return ([int]$Matches[1] -eq 10 -and [int]$Matches[2] -eq 0 -and [int]$Matches[3] -ge 301)
            }
            return $false
          }).Count -gt 0
          "DOTNET_SDK_PRESENT=$($hasCompatibleSdk.ToString().ToLowerInvariant())" >> $env:GITHUB_ENV

      - name: Setup .NET SDK
        if: env.DOTNET_SDK_PRESENT != 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.301
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Release solution without packaging
        shell: pwsh
        run: |
          dotnet build WinoMail.slnx `
            --configuration Release `
            /m:1 `
            /p:Platform=x64 `
            /p:UseNativeAot=false `
            /p:EnableMsixTooling=false `
            /p:GenerateAppxPackageOnBuild=false `
            /p:AppxPackageSigningEnabled=false `
            /p:RestoreConfigFile=$env:NUGET_CONFIG_PATH
          if ($LASTEXITCODE -ne 0) { throw 'Release solution build failed.' }

      - name: Run actual Release test projects
        shell: pwsh
        run: |
          $testProjects = @(
            'tests/Wino.NotificationHost.Tests/Wino.NotificationHost.Tests.csproj'
          )

          foreach ($project in $testProjects) {
            Write-Host "Running test project: $project"
            dotnet test $project `
              --configuration Release `
              --no-restore `
              /m:1 `
              /p:Platform=x64 `
              /p:UseNativeAot=false `
              --logger "console;verbosity=minimal"
            if ($LASTEXITCODE -ne 0) { throw "Test project failed: $project" }
          }

      - name: Restore SQLite Native AOT smoke project
        shell: pwsh
        run: |
          dotnet restore tests/Wino.Services.AotSmoke/Wino.Services.AotSmoke.csproj `
            --configfile $env:NUGET_CONFIG_PATH `
            -r win-x64 `
            -p:Platform=x64
          if ($LASTEXITCODE -ne 0) { throw 'SQLite smoke harness restore failed.' }

      - name: Publish and run SQLite Native AOT smoke harness
        shell: pwsh
        run: |
          dotnet publish tests/Wino.Services.AotSmoke/Wino.Services.AotSmoke.csproj `
            --configuration Release `
            --no-restore `
            -r win-x64 `
            /p:Platform=x64 `
            /p:TreatWarningsAsErrors=true `
            /p:TrimmerSingleWarn=false
          if ($LASTEXITCODE -ne 0) { throw 'SQLite Native AOT publish failed.' }

          & tests/Wino.Services.AotSmoke/bin/x64/Release/net10.0/win-x64/publish/Wino.Services.AotSmoke.exe
          if ($LASTEXITCODE -ne 0) { throw 'SQLite Native AOT smoke test failed.' }

# This build is the single Native AOT WinUI compilation; its exact bundle is installed and tested.

  notification-runtime:
    name: Build Native AOT Beta MSIX and test BackgroundSyncHost
    runs-on: windows-latest
    concurrency:
      group: beta-validation-runtime-${{ github.ref }}
      cancel-in-progress: true
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check installed .NET SDK
        shell: pwsh
        run: |
          $present = @(dotnet --list-sdks | Where-Object {
            if ($_ -match '^([0-9]+)\.([0-9]+)\.([0-9]+)\s') {
              return ([int]$Matches[1] -eq 10 -and [int]$Matches[2] -eq 0 -and [int]$Matches[3] -ge 301)
            }
            return $false
          }).Count -gt 0
          "DOTNET_SDK_PRESENT=$($present.ToString().ToLowerInvariant())" >> $env:GITHUB_ENV

      - name: Setup .NET SDK
        if: env.DOTNET_SDK_PRESENT != 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.301

      - name: Read Beta package identity
        shell: pwsh
        run: |
          $profile = Get-Content -LiteralPath 'scripts/release/windows/profiles/Beta.json' -Raw | ConvertFrom-Json
          if ($profile.Distribution -cne 'Beta' -or $profile.PackageName -cne 'WinoMail.Beta') { throw 'Beta profile identity mismatch.' }
          "PACKAGE_PUBLISHER=$($profile.Publisher)" >> $env:GITHUB_ENV
          "PACKAGE_NAME=$($profile.PackageName)" >> $env:GITHUB_ENV

      - name: Create Beta test certificate
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject $env:PACKAGE_PUBLISHER -KeyAlgorithm RSA -KeyLength 2048 -HashAlgorithm SHA256 -CertStoreLocation 'Cert:\CurrentUser\My' -KeyExportPolicy Exportable -NotAfter (Get-Date).AddDays(7)
          if ($null -eq $cert -or -not $cert.HasPrivateKey) { throw 'Could not create the Beta test signing certificate.' }
          "CERT_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV

      - name: Build installable Beta MSIXBundle
        shell: pwsh
        run: |
          pwsh -NoProfile -File .\tests\scripts\Build-Beta-TestBundle.ps1 -CertificateThumbprint $env:CERT_THUMBPRINT -BetaAssetsPath .\scripts\release\Assets\Beta
          if ($LASTEXITCODE -ne 0) { throw 'Beta MSIXBundle build failed.' }

          $manifest = [xml](Get-Content -LiteralPath 'src/Wino.Mail.WinUI/Package.appxmanifest' -Raw)
          $version = [string]$manifest.Package.Identity.Version
          $releaseDir = Join-Path (Join-Path (Join-Path $env:RUNNER_TEMP 'Wino Beta Test Releases') $version) 'Beta'
          $bundle = Join-Path $releaseDir "WinoMail_Beta_$version.msixbundle"
          $certificate = Join-Path $releaseDir 'WinoMail_Beta_TestCertificate.cer'

          if (-not (Test-Path -LiteralPath $bundle -PathType Leaf)) { throw "Installable Beta MSIXBundle was not produced: $bundle" }
          if (-not (Test-Path -LiteralPath $certificate -PathType Leaf)) { throw "Beta test certificate was not produced: $certificate" }

          "BUNDLE_PATH=$((Resolve-Path -LiteralPath $bundle).Path)" >> $env:GITHUB_ENV
          "CERTIFICATE_PATH=$((Resolve-Path -LiteralPath $certificate).Path)" >> $env:GITHUB_ENV
          "BETA_RELEASE_DIR=$((Resolve-Path -LiteralPath $releaseDir).Path)" >> $env:GITHUB_ENV

      - name: Install Beta test certificate and bundle
        shell: pwsh
        run: |
          Import-Certificate -FilePath $env:CERTIFICATE_PATH -CertStoreLocation 'Cert:\LocalMachine\TrustedPeople' -ErrorAction Stop | Out-Null
          Add-AppxPackage -Path $env:BUNDLE_PATH -ForceApplicationShutdown -ErrorAction Stop

          $package = Get-AppxPackage -Name 'WinoMail.Beta' -ErrorAction Stop
          "PACKAGE_FAMILY=$($package.PackageFamilyName)" >> $env:GITHUB_ENV
          $manifest = Get-AppxPackageManifest $package
          if ([string]$manifest.Package.Identity.Name -cne 'WinoMail.Beta') { throw 'Installed package identity mismatch.' }
          $sourceManifest = [xml](Get-Content -LiteralPath 'src/Wino.Mail.WinUI/Package.appxmanifest' -Raw)
          $expectedVersion = [string]$sourceManifest.Package.Identity.Version
          if ([string]$manifest.Package.Identity.Version -cne $expectedVersion) {
            throw "Installed package version mismatch: expected $expectedVersion, got $($manifest.Package.Identity.Version)."
          }

          $startupTasks = @($manifest.SelectNodes("//*[local-name()='StartupTask']"))
          if ($startupTasks.Count -ne 1) {
            throw "Expected exactly one installed Windows startup task; found $($startupTasks.Count)."
          }
          if ($startupTasks[0].GetAttribute('TaskId') -cne 'WinoStartupId') {
            throw "Unexpected Windows startup task: $($startupTasks[0].GetAttribute('TaskId'))."
          }
          $startupOwner = $startupTasks[0].SelectSingleNode("ancestor::*[local-name()='Application'][1]")
          if ($null -eq $startupOwner -or $startupOwner.GetAttribute('Id') -cne 'App') {
            throw 'The single user startup task must belong to the Wino Mail UI application.'
          }
          $backgroundHostTasks = $manifest.SelectNodes("//*[local-name()='Application'][@Id='BackgroundSyncHost']//*[local-name()='StartupTask']")
          if ($backgroundHostTasks.Count -ne 0) {
            throw 'BackgroundSyncHost must be activated on demand, not registered as a second Windows startup entry.'
          }
          $backgroundHostActivation = $manifest.SelectNodes("//*[local-name()='Application'][@Id='BackgroundSyncHost']//*[local-name()='FullTrustProcess']")
          if ($backgroundHostActivation.Count -ne 1) {
            throw 'Packaged BackgroundSyncHost on-demand full-trust activation is missing.'
          }
          $sessionStartHost = $manifest.SelectNodes("//*[local-name()='Extension'][@Category='windows.backgroundTasks' and @EntryPoint='Microsoft.Windows.ApplicationModel.Background.UniversalBGTask.Task']")
          if ($sessionStartHost.Count -ne 1) {
            throw 'The UI session-start background-task host registration is missing.'
          }

          "PACKAGE_VERSION=$expectedVersion" >> $env:GITHUB_ENV

      - name: Create artifact provenance metadata
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($path in @($env:BUNDLE_PATH, $env:CERTIFICATE_PATH)) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Required Beta artifact is missing: $path" }
          }
          if ($env:BUNDLE_PATH -notmatch ('WinoMail_Beta_' + [regex]::Escape($env:PACKAGE_VERSION) + '\.msixbundle$')) {
            throw "Bundle filename does not match package version $env:PACKAGE_VERSION."
          }
          $signature = Get-AuthenticodeSignature -LiteralPath $env:BUNDLE_PATH
          if ($null -eq $signature.SignerCertificate -or $signature.SignerCertificate.Thumbprint -cne $env:CERT_THUMBPRINT) {
            throw 'Bundle signature does not match the workflow test certificate.'
          }
          $metadata = [ordered]@{
            SchemaVersion = 1
            CommitSha = $env:GITHUB_SHA
            RuntimeRunId = [long]$env:GITHUB_RUN_ID
            PackageVersion = $env:PACKAGE_VERSION
            BundleFile = [IO.Path]::GetFileName($env:BUNDLE_PATH)
            BundleSha256 = (Get-FileHash -LiteralPath $env:BUNDLE_PATH -Algorithm SHA256).Hash.ToLowerInvariant()
            TestCertificateFile = [IO.Path]::GetFileName($env:CERTIFICATE_PATH)
            TestCertificateSha256 = (Get-FileHash -LiteralPath $env:CERTIFICATE_PATH -Algorithm SHA256).Hash.ToLowerInvariant()
          }
          $metadataPath = Join-Path $env:BETA_RELEASE_DIR 'artifact-metadata.json'
          $metadata | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath $metadataPath -Encoding utf8
          Write-Host "Wrote provenance metadata for commit $env:GITHUB_SHA, version $env:PACKAGE_VERSION, run $env:GITHUB_RUN_ID."

      - name: Upload installable Beta bundle and certificate
        uses: actions/upload-artifact@v4
        with:
          name: Installable-Beta-MSIXBundle
          path: |
            ${{ env.BUNDLE_PATH }}
            ${{ env.CERTIFICATE_PATH }}
            ${{ env.BETA_RELEASE_DIR }}/artifact-metadata.json
          if-no-files-found: error
      - name: Run background notification smoke while UI is open
        shell: pwsh
        run: |
          $package = Get-AppxPackage -Name $env:PACKAGE_NAME -ErrorAction Stop
          $exe = Join-Path $package.InstallLocation 'Wino.Mail.WinUI.exe'
          $backgroundHostPath = Join-Path $package.InstallLocation 'BackgroundSyncHost\Wino.Mail.BackgroundSyncHost.exe'
          if (-not (Test-Path -LiteralPath $backgroundHostPath)) { throw 'BackgroundSyncHost payload is missing.' }

          $targetAumid = "$($package.PackageFamilyName)!App"
          Write-Host "Launching packaged UI through $targetAumid"

          Start-Process -FilePath "$env:WINDIR\explorer.exe" -ArgumentList "shell:AppsFolder\$targetAumid" | Out-Null

          $ui = $null
          for ($attempt = 0; $attempt -lt 20 -and $null -eq $ui; $attempt++) {
            Start-Sleep -Seconds 1
            $ui = Get-Process -Name 'Wino.Mail.WinUI' -ErrorAction SilentlyContinue | Select-Object -First 1
          }

          if ($null -eq $ui) { throw 'Packaged Wino Mail UI process did not start.' }

          # Exercise the real process detector while WinUI is alive. This mode exits before
          # database initialization or scheduler startup, and fails if the UI process is absent.
          $diagnosticPaths = @(
            (Join-Path $env:LOCALAPPDATA 'Wino Mail/background-sync-host-startup.log'),
            (Join-Path $env:TEMP 'Wino Mail/background-sync-host-startup.log')
          ) | Select-Object -Unique
          $diagnosticStartLengths = @{}
          foreach ($path in $diagnosticPaths) {
            $diagnosticStartLengths[$path] = if (Test-Path -LiteralPath $path -PathType Leaf) {
              (Get-Content -LiteralPath $path -Raw).Length
            } else {
              0
            }
          }

          $gateSmokeProcess = Start-Process -FilePath $backgroundHostPath -ArgumentList '--background-loop-gate-smoke-test' -WorkingDirectory $package.InstallLocation -PassThru -Wait

          $newDiagnosticText = foreach ($path in $diagnosticPaths) {
            if (Test-Path -LiteralPath $path -PathType Leaf) {
              $text = Get-Content -LiteralPath $path -Raw
              $startLength = [int]$diagnosticStartLengths[$path]
              if ($text.Length -ge $startLength) { $text.Substring($startLength) } else { $text }
            }
          }
          $newDiagnosticText = $newDiagnosticText -join [Environment]::NewLine

          # Exit code 0 is emitted only by the gate smoke branch after it detects WinUI
          # and confirms the scheduler policy keeps automatic loops inactive. Logs are
          # best-effort diagnostics because packaged processes may redirect local paths.
          if ($newDiagnosticText -match '\[LOOPS\] Starting automatic synchronization only while WinUI is closed\.') {
            throw 'Background loop gate smoke unexpectedly entered the background synchronization loops while WinUI was running.'
          }
          if ($newDiagnosticText) {
            Write-Host "Background loop gate diagnostics: $newDiagnosticText"
          }
          if ($gateSmokeProcess.ExitCode -ne 0) {
            throw "Background loop gate smoke failed while WinUI was running with exit code $($gateSmokeProcess.ExitCode). Diagnostics: $newDiagnosticText"
          }

          Write-Host 'Verified: WinUI is running and the background synchronization loops remain inactive.'

          $smokeProcess = Start-Process -FilePath $backgroundHostPath -ArgumentList '--notification-smoke-test' -WorkingDirectory $package.InstallLocation -PassThru -Wait
          $smokeExitCode = $smokeProcess.ExitCode

          foreach ($diagnosticPath in @(
            (Join-Path $env:LOCALAPPDATA 'Wino Mail/background-sync-host-startup.log'),
            (Join-Path $env:TEMP 'Wino Mail/background-sync-host-startup.log')
          )) {
            if (Test-Path -LiteralPath $diagnosticPath -PathType Leaf) {
              Write-Host "BackgroundSyncHost diagnostic: $diagnosticPath"
              Get-Content -LiteralPath $diagnosticPath -Tail 80
            }
          }

          foreach ($notificationLog in @(
            (Join-Path $env:LOCALAPPDATA "Packages\$($package.PackageFamilyName)\LocalCache\NotificationHost\Logs\NotificationHost.log"),
            (Join-Path $env:LOCALAPPDATA "Packages\$($package.PackageFamilyName)\LocalCache\NotificationHost.log"),
            (Join-Path $env:TEMP 'Wino Mail/NotificationHost.log')
          ) | Select-Object -Unique) {
            if (Test-Path -LiteralPath $notificationLog -PathType Leaf) {
              Write-Host "NotificationHost diagnostic: $notificationLog"
              Get-Content -LiteralPath $notificationLog -Tail 120
            }
          }

          if ($smokeExitCode -ne 0) { throw "Background notification smoke failed while UI was open with exit code $smokeExitCode." }
          Start-Sleep -Seconds 3
          if ($ui.HasExited) { throw 'UI process exited unexpectedly during the background notification smoke.' }
          Stop-Process -Id $ui.Id -Force -ErrorAction SilentlyContinue

      - name: Run background notification smoke with UI closed
        shell: pwsh
        run: |
          $package = Get-AppxPackage -Name $env:PACKAGE_NAME -ErrorAction Stop
          $backgroundHostPath = Join-Path $package.InstallLocation 'BackgroundSyncHost\Wino.Mail.BackgroundSyncHost.exe'
          $smokeProcess = Start-Process -FilePath $backgroundHostPath -ArgumentList '--notification-smoke-test' -WorkingDirectory $package.InstallLocation -PassThru -Wait
          $smokeExitCode = $smokeProcess.ExitCode

          foreach ($diagnosticPath in @(
            (Join-Path $env:LOCALAPPDATA 'Wino Mail/background-sync-host-startup.log'),
            (Join-Path $env:TEMP 'Wino Mail/background-sync-host-startup.log')
          )) {
            if (Test-Path -LiteralPath $diagnosticPath -PathType Leaf) {
              Write-Host "BackgroundSyncHost diagnostic: $diagnosticPath"
              Get-Content -LiteralPath $diagnosticPath -Tail 80
            }
          }

          if ($smokeExitCode -ne 0) { throw "Background notification smoke failed while UI was closed with exit code $smokeExitCode." }

      - name: Verify BackgroundSyncHost packaged activation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $package = Get-AppxPackage -Name $env:PACKAGE_NAME -ErrorAction Stop
          $backgroundHostPath = Join-Path $package.InstallLocation 'BackgroundSyncHost\Wino.Mail.BackgroundSyncHost.exe'
          if (-not (Test-Path -LiteralPath $backgroundHostPath -PathType Leaf)) { throw 'BackgroundSyncHost payload is missing.' }

          $targetAumid = "$($package.PackageFamilyName)!BackgroundSyncHost"
          Write-Host "Launching BackgroundSyncHost through packaged AUMID $targetAumid"

          $before = @(Get-Process -Name 'Wino.Mail.BackgroundSyncHost' -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Id)
          Start-Process -FilePath "$env:WINDIR\explorer.exe" -ArgumentList "shell:AppsFolder\$targetAumid" | Out-Null

          $backgroundHostProcess = $null
          for ($attempt = 0; $attempt -lt 20 -and $null -eq $backgroundHostProcess; $attempt++) {
            Start-Sleep -Seconds 1
            $backgroundHostProcess = Get-Process -Name 'Wino.Mail.BackgroundSyncHost' -ErrorAction SilentlyContinue |
              Where-Object { $before -notcontains $_.Id } |
              Select-Object -First 1
          }

          foreach ($diagnosticPath in @(
            (Join-Path $env:LOCALAPPDATA 'Wino Mail/background-sync-host-startup.log'),
            (Join-Path $env:TEMP 'Wino Mail/background-sync-host-startup.log')
          )) {
            if (Test-Path -LiteralPath $diagnosticPath -PathType Leaf) {
              Write-Host "BackgroundSyncHost diagnostic: $diagnosticPath"
              Get-Content -LiteralPath $diagnosticPath -Tail 120
            }
          }

          if ($null -ne $backgroundHostProcess) {
            Write-Host "BackgroundSyncHost packaged activation produced PID $($backgroundHostProcess.Id)."
            Start-Sleep -Seconds 5

            if (Get-Process -Id $backgroundHostProcess.Id -ErrorAction SilentlyContinue) {
              Write-Host 'BackgroundSyncHost is still running after packaged activation; stopping the CI instance.'
              Stop-Process -Id $backgroundHostProcess.Id -Force -ErrorAction SilentlyContinue
            }
          }

          $diagnosticText = ''
          foreach ($diagnosticPath in @(
            (Join-Path $env:LOCALAPPDATA 'Wino Mail/background-sync-host-startup.log'),
            (Join-Path $env:TEMP 'Wino Mail/background-sync-host-startup.log')
          )) {
            if (Test-Path -LiteralPath $diagnosticPath -PathType Leaf) {
              Write-Host "BackgroundSyncHost diagnostic: $diagnosticPath"
              $diagnosticText += (Get-Content -LiteralPath $diagnosticPath -Raw) + [Environment]::NewLine
              Get-Content -LiteralPath $diagnosticPath -Tail 160
            }
          }

          if ([string]::IsNullOrWhiteSpace($diagnosticText)) {
            throw "BackgroundSyncHost produced no diagnostic output after packaged activation through $targetAumid."
          }

          $failureLines = $diagnosticText -split [Environment]::NewLine | Where-Object { $_ -match '\[FAIL\]' }
          $exitLines = $diagnosticText -split [Environment]::NewLine | Where-Object { $_ -match '\[EXIT\].*code\s+(\d+)' }

          if ($failureLines.Count -gt 0 -or ($exitLines.Count -gt 0 -and (($exitLines[-1] -match 'code\s+(\d+)') -and [int]$Matches[1] -ne 0))) {
            throw "BackgroundSyncHost failed during packaged activation through $targetAumid."
          }

          if ($null -eq $backgroundHostProcess -and $exitLines.Count -eq 0) {
            throw "BackgroundSyncHost did not start or report a clean exit after packaged activation through $targetAumid."
          }

      - name: Verify RunInBackgroundWithoutTrayIcon exits WinUI process
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $package = Get-AppxPackage -Name $env:PACKAGE_NAME -ErrorAction Stop
          $exe = Join-Path $package.InstallLocation 'Wino.Mail.WinUI.exe'

          Get-Process -Name 'Wino.Mail.WinUI' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2

          $markerDirectory = Join-Path $env:LOCALAPPDATA "Packages\$($package.PackageFamilyName)\LocalState"
          $markerPath = Join-Path $markerDirectory '.wino-close-behavior-smoke'
          New-Item -ItemType Directory -Force -Path $markerDirectory | Out-Null
          Set-Content -LiteralPath $markerPath -Value 'RunInBackgroundWithoutTrayIcon' -NoNewline

          $targetAumid = "$($package.PackageFamilyName)!App"
          Write-Host "Launching packaged WinUI through $targetAumid with the CI-only no-tray preference marker."
          Start-Process -FilePath "$env:WINDIR\explorer.exe" -ArgumentList "shell:AppsFolder\$targetAumid" | Out-Null

          $ui = $null
          for ($attempt = 0; $attempt -lt 30 -and $null -eq $ui; $attempt++) {
            Start-Sleep -Seconds 1
            $ui = Get-Process -Name 'Wino.Mail.WinUI' -ErrorAction SilentlyContinue |
              Where-Object { $_.MainWindowHandle -ne 0 } |
              Select-Object -First 1
          }

          if ($null -eq $ui) { throw 'Packaged Wino Mail UI window did not become visible for the close-behavior smoke test.' }
          $firstPid = $ui.Id
          Write-Host "Closing WinUI PID $firstPid via its real main window." 

          if (-not $ui.CloseMainWindow()) {
            throw "CloseMainWindow returned false for WinUI PID $firstPid."
          }

          if (-not $ui.WaitForExit(15000)) {
            $diagnosticPath = Join-Path $env:TEMP 'Wino Mail/winui-launch-smoke.log'
            if (Test-Path -LiteralPath $diagnosticPath) { Get-Content -LiteralPath $diagnosticPath -Tail 120 }
            Get-Process -Id $firstPid -ErrorAction SilentlyContinue | Format-List Id,ProcessName,MainWindowHandle,StartTime,Path
            throw "WinUI PID $firstPid remained alive after RunInBackgroundWithoutTrayIcon close."
          }

          Start-Sleep -Seconds 2
          if (Get-Process -Id $firstPid -ErrorAction SilentlyContinue) {
            throw "WinUI PID $firstPid was still present after WaitForExit returned."
          }

          Write-Host "WinUI PID $firstPid exited as expected. Relaunching through packaged activation to prove the old invisible process no longer captures activation."
          Start-Process -FilePath "$env:WINDIR\explorer.exe" -ArgumentList "shell:AppsFolder\$targetAumid" | Out-Null

          $secondUi = $null
          for ($attempt = 0; $attempt -lt 30 -and $null -eq $secondUi; $attempt++) {
            Start-Sleep -Seconds 1
            $secondUi = Get-Process -Name 'Wino.Mail.WinUI' -ErrorAction SilentlyContinue |
              Where-Object { $_.MainWindowHandle -ne 0 } |
              Select-Object -First 1
          }

          if ($null -eq $secondUi) { throw 'Wino Mail could not present a visible window after the no-tray process exited.' }
          if ($secondUi.Id -eq $firstPid) { throw 'The relaunch unexpectedly reused the closed WinUI process PID.' }
          Write-Host "Second launch produced visible WinUI PID $($secondUi.Id)."

          Stop-Process -Id $secondUi.Id -Force -ErrorAction SilentlyContinue

      - name: Uninstall Beta package and remove certificate
        if: always()
        shell: pwsh
        run: |
          Get-AppxPackage -Name 'WinoMail.Beta' -ErrorAction SilentlyContinue | ForEach-Object {
            Remove-AppxPackage -Package $_.PackageFullName -ErrorAction SilentlyContinue
          }
          if ($env:CERT_THUMBPRINT) {
            Get-ChildItem 'Cert:\LocalMachine\TrustedPeople' -ErrorAction SilentlyContinue | Where-Object Thumbprint -eq $env:CERT_THUMBPRINT | ForEach-Object { Remove-Item -LiteralPath "Cert:\LocalMachine\TrustedPeople\$($_.Thumbprint)" -Force -ErrorAction SilentlyContinue }
            Get-ChildItem 'Cert:\CurrentUser\My' -ErrorAction SilentlyContinue | Where-Object Thumbprint -eq $env:CERT_THUMBPRINT | ForEach-Object { Remove-Item -LiteralPath "Cert:\CurrentUser\My\$($_.Thumbprint)" -Force -ErrorAction SilentlyContinue }
          }

  publish:
    name: Publish only the fully verified commit
    needs: [native-aot, notification-runtime]
    if: github.ref == 'refs/heads/integration/msix-release-upstream-main' && needs.native-aot.result == 'success' && needs.notification-runtime.result == 'success'
    runs-on: windows-latest
    timeout-minutes: 45
    concurrency:
      group: beta-publish-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Download the already-tested MSIXBundle artifact
        uses: actions/download-artifact@v4
        with:
          name: Installable-Beta-MSIXBundle
          path: ${{ runner.temp }}/verified-msix
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}

      - name: Validate artifact and publish versioned Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.sha }}
          RUNTIME_RUN_ID: ${{ github.run_id }}
        run: |
          $branchHead = gh api "repos/$env:GITHUB_REPOSITORY/commits/integration/msix-release-upstream-main" --jq .sha
          if ($LASTEXITCODE -ne 0) { throw 'Could not verify current integration branch head; refusing to publish.' }
          if ($branchHead -ne $env:COMMIT_SHA) { throw "This commit ($env:COMMIT_SHA) is stale; current branch head is $branchHead. Refusing to publish an outdated Release." }

          $manifest = [xml](Get-Content -LiteralPath 'src/Wino.Mail.WinUI/Package.appxmanifest' -Raw)
          $version = [string]$manifest.Package.Identity.Version
          if ($version -notmatch '^[1-9]\d*\.\d+\.\d+\.0$') { throw "Invalid package version: $version" }
          $tag = "beta/v$version"
          $assets = Join-Path $env:RUNNER_TEMP 'verified-msix'
          $bundle = Get-ChildItem -LiteralPath $assets -Recurse -Filter "WinoMail_Beta_$version.msixbundle" | Select-Object -First 1
          $certificate = Get-ChildItem -LiteralPath $assets -Recurse -Filter 'WinoMail_Beta_TestCertificate.cer' | Select-Object -First 1
          if (-not $bundle -or -not $certificate) { Get-ChildItem -LiteralPath $assets -Recurse | Format-Table FullName; throw 'Verified bundle or matching test certificate missing from runtime workflow artifact.' }
          $metadataFile = Get-ChildItem -LiteralPath $assets -Recurse -Filter 'artifact-metadata.json' | Select-Object -First 1
          if (-not $metadataFile) { throw 'Artifact provenance metadata is missing; refusing to publish.' }
          $artifactMetadata = Get-Content -LiteralPath $metadataFile.FullName -Raw | ConvertFrom-Json
          if ([int]$artifactMetadata.SchemaVersion -ne 1) { throw 'Unsupported artifact provenance metadata schema.' }
          if ([string]$artifactMetadata.CommitSha -cne $env:COMMIT_SHA) { throw "Artifact commit mismatch: expected $env:COMMIT_SHA, got $($artifactMetadata.CommitSha)." }
          if ([long]$artifactMetadata.RuntimeRunId -ne [long]$env:RUNTIME_RUN_ID) { throw "Artifact runtime run mismatch: expected $env:RUNTIME_RUN_ID, got $($artifactMetadata.RuntimeRunId)." }
          if ([string]$artifactMetadata.PackageVersion -cne $version) { throw "Artifact version mismatch: manifest is $version, artifact is $($artifactMetadata.PackageVersion)." }
          if ([string]$artifactMetadata.BundleFile -cne $bundle.Name) { throw "Artifact bundle filename mismatch: metadata says $($artifactMetadata.BundleFile), found $($bundle.Name)." }
          if ([string]$artifactMetadata.TestCertificateFile -cne $certificate.Name) { throw 'Artifact test certificate filename does not match provenance metadata.' }
          $bundleHash = (Get-FileHash -LiteralPath $bundle.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $certificateHash = (Get-FileHash -LiteralPath $certificate.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($bundleHash -cne ([string]$artifactMetadata.BundleSha256).ToLowerInvariant()) { throw 'MSIXBundle SHA-256 does not match runtime workflow provenance.' }
          if ($certificateHash -cne ([string]$artifactMetadata.TestCertificateSha256).ToLowerInvariant()) { throw 'Test certificate SHA-256 does not match runtime workflow provenance.' }
          $notes = Join-Path $env:RUNNER_TEMP 'RELEASE-NOTES.md'
          @"
          Wino Mail Beta $version

          Published only after the Release build/tests/Native AOT/SQLite AOT workflow and the packaged Beta runtime smoke workflow both succeeded for commit $env:COMMIT_SHA.

          **Signing:** this bundle is signed with an ephemeral CI test certificate, not a trusted production signing certificate. The attached certificate is required to install this test build and must not be treated as a production trust root.
          
          Verified runtime workflow run: $env:RUNTIME_RUN_ID
          Commit: $env:COMMIT_SHA
          MSIXBundle SHA-256: $bundleHash
          Test certificate SHA-256: $certificateHash
          "@ | Set-Content -LiteralPath $notes -Encoding utf8
          # Existing versions are updated in place, matching the established Beta publishing behavior.
          # Before mutating an existing Release, prove its tag can be safely fast-forwarded to this commit.
          $encodedTag = [uri]::EscapeDataString($tag)
          $releaseResponse = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$encodedTag" 2>&1
          $releaseQueryExitCode = $LASTEXITCODE
          $releaseExists = $false
          $existing = $null

          if ($releaseQueryExitCode -eq 0) {
            $existing = ($releaseResponse -join "`n") | ConvertFrom-Json
            $releaseExists = $true
          } else {
            $releaseQueryError = $releaseResponse | Out-String
            if ($releaseQueryError -notmatch '(?i)HTTP 404|Not Found') {
              throw "Could not determine whether Release '$tag' exists: $releaseQueryError"
            }
          }

          # Re-check the branch before any Release or asset mutation.
          $finalBranchHead = gh api "repos/$env:GITHUB_REPOSITORY/commits/integration/msix-release-upstream-main" --jq .sha
          if ($LASTEXITCODE -ne 0) { throw 'Could not re-check integration branch head before publication; refusing to publish.' }
          if ($finalBranchHead -cne $env:COMMIT_SHA) {
            throw "Commit $env:COMMIT_SHA became stale before publication; current branch head is $finalBranchHead. Refusing to publish."
          }

          if ($releaseExists) {
            $tagRefJson = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$tag" 2>&1
            if ($LASTEXITCODE -ne 0) { throw "Release '$tag' exists but its tag cannot be read; refusing to modify its assets or metadata. $($tagRefJson | Out-String)" }
            $tagInfo = ($tagRefJson -join "`n") | ConvertFrom-Json
            if ([string]$tagInfo.object.type -cne 'commit') {
              throw "Release tag '$tag' is not a direct commit reference; refusing to rewrite it."
            }

            $existingTagSha = [string]$tagInfo.object.sha
            if ($existingTagSha -cne $env:COMMIT_SHA) {
              $comparisonStatus = gh api "repos/$env:GITHUB_REPOSITORY/compare/$existingTagSha...$env:COMMIT_SHA" --jq .status
              if ($LASTEXITCODE -ne 0) { throw "Could not verify whether Release tag '$tag' can be fast-forwarded to $env:COMMIT_SHA." }
              if ($comparisonStatus -cnotin @('ahead', 'identical')) {
                throw "Release tag '$tag' points to $existingTagSha, which is not an ancestor of $env:COMMIT_SHA (comparison: $comparisonStatus). No Release assets, metadata, or tag were changed. Increment the package version or reconcile the branch history first."
              }
            }

            $bundleAsset = $existing.assets | Where-Object { $_.name -ceq $bundle.Name } | Select-Object -First 1
            $certificateAsset = $existing.assets | Where-Object { $_.name -ceq $certificate.Name } | Select-Object -First 1
            $bundleAssetDigest = [string]$bundleAsset.digest
            $certificateAssetDigest = [string]$certificateAsset.digest
            $expectedBundleDigest = "sha256:$bundleHash"
            $expectedCertificateDigest = "sha256:$certificateHash"

            $assetsToUpload = @()
            if (-not $bundleAsset -or $bundleAssetDigest -cne $expectedBundleDigest) {
              $assetsToUpload += $bundle.FullName
            }
            if (-not $certificateAsset -or $certificateAssetDigest -cne $expectedCertificateDigest) {
              $assetsToUpload += $certificate.FullName
            }

            if ($assetsToUpload.Count -gt 0) {
              gh release upload $tag @assetsToUpload --clobber
              if ($LASTEXITCODE -ne 0) { throw "Failed to update existing Release '$tag' assets." }
            } else {
              Write-Host "Release '$tag' already has both assets with the expected SHA-256 digests."
            }

            # Verify the uploaded/reused assets before changing Release notes or its tag.
            $updatedReleaseJson = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$tag"
            if ($LASTEXITCODE -ne 0) { throw "Could not verify updated Release '$tag'." }
            $updatedRelease = $updatedReleaseJson | ConvertFrom-Json
            $updatedBundle = $updatedRelease.assets | Where-Object { $_.name -ceq $bundle.Name } | Select-Object -First 1
            $updatedCertificate = $updatedRelease.assets | Where-Object { $_.name -ceq $certificate.Name } | Select-Object -First 1
            if ([string]$updatedBundle.digest -cne $expectedBundleDigest -or
                [string]$updatedCertificate.digest -cne $expectedCertificateDigest) {
              throw "Release '$tag' asset digests do not match the validated artifact; refusing to update Release metadata or tag."
            }

            gh release edit $tag --title "Wino Mail Beta $version" --notes-file $notes --prerelease
            if ($LASTEXITCODE -ne 0) { throw "Failed to update existing Release '$tag' metadata." }

            # Preserve the old fast-forward-only tag behavior. Never force-move a tag.
            if ($existingTagSha -cne $env:COMMIT_SHA) {
              $branchHeadBeforeTagUpdate = gh api "repos/$env:GITHUB_REPOSITORY/commits/integration/msix-release-upstream-main" --jq .sha
              if ($LASTEXITCODE -ne 0 -or $branchHeadBeforeTagUpdate -cne $env:COMMIT_SHA) {
                throw "Integration branch advanced while updating Release '$tag'; refusing to move its tag to a stale commit."
              }

              gh api --method PATCH "repos/$env:GITHUB_REPOSITORY/git/refs/tags/$tag" -f "sha=$env:COMMIT_SHA" -F force=false
              if ($LASTEXITCODE -ne 0) { throw "Could not fast-forward existing Release tag '$tag' to $env:COMMIT_SHA." }
              $updatedTagJson = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$tag"
              if ($LASTEXITCODE -ne 0) { throw "Could not verify the updated Release tag '$tag'." }
              $updatedTag = $updatedTagJson | ConvertFrom-Json
              if ([string]$updatedTag.object.type -cne 'commit' -or [string]$updatedTag.object.sha -cne $env:COMMIT_SHA) {
                throw "Release tag '$tag' did not resolve to $env:COMMIT_SHA after the fast-forward update."
              }
            }

            Write-Host "Updated existing Beta Release '$tag' assets and metadata from verified commit $env:COMMIT_SHA."
          } else {
            # A tag without a Release is occupied; do not silently reuse or move it.
            $tagCheck = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$tag" 2>&1
            $tagCheckExitCode = $LASTEXITCODE
            if ($tagCheckExitCode -eq 0) {
              throw "Tag '$tag' already exists without a Release. Refusing to reuse or move it."
            }
            $tagCheckError = $tagCheck | Out-String
            if ($tagCheckError -notmatch '(?i)HTTP 404|Not Found') {
              throw "Could not determine whether tag '$tag' exists: $tagCheckError"
            }

            # Re-check immediately before creating a new Release.
            $finalBranchHead = gh api "repos/$env:GITHUB_REPOSITORY/commits/integration/msix-release-upstream-main" --jq .sha
            if ($LASTEXITCODE -ne 0 -or $finalBranchHead -cne $env:COMMIT_SHA) {
              throw "Commit $env:COMMIT_SHA is no longer the current integration branch head; refusing to create Release '$tag'."
            }

            gh release create $tag $bundle.FullName $certificate.FullName --target $env:COMMIT_SHA --title "Wino Mail Beta $version" --notes-file $notes --prerelease
            if ($LASTEXITCODE -ne 0) { throw "Failed to create versioned Release '$tag'." }
          }
