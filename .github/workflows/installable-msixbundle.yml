name: Installable Beta MSIXBundle

on:
  pull_request:
    paths:
      - 'src/Wino.Mail.WinUI/**'
      - 'src/Wino.Mail.BackgroundSyncHost/**'
      - 'src/Wino.Platform.Windows/**'
      - 'src/Wino.Core/**'
      - 'src/Wino.Services/**'
      - 'src/Wino.Core.Domain/**'
      - 'src/Wino.SourceGenerators/**'
      - 'src/Wino.NotificationHost.Contracts/**'
      - 'src/Wino.Mail.NotificationHost/**'
      - 'src/Wino.Calendar.NotificationHost/**'
      - 'src/Wino.People.NotificationHost/**'
      - 'src/Wino.Tasks.NotificationHost/**'
      - 'controls/**'
      - 'scripts/**'
      - 'Directory.*'
      - 'WinoMail.slnx'
      - 'nuget.config'
      - 'global.json'
      - '.github/workflows/installable-msixbundle.yml'
  workflow_dispatch:

concurrency:
  group: installable-beta-msixbundle-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  package-install:
    name: Build, install and uninstall x64 Beta MSIXBundle
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check preinstalled .NET SDK
        shell: pwsh
        run: |
          $hasRequiredSdk = @(dotnet --list-sdks | Where-Object {
            if ($_ -match '^([0-9]+)\.([0-9]+)\.([0-9]+)\s') {
              return ([int]$Matches[1] -eq 10 -and [int]$Matches[2] -eq 0 -and [int]$Matches[3] -ge 301)
            }
            return $false
          }).Count -gt 0
          "DOTNET_SDK_PRESENT=$($hasRequiredSdk.ToString().ToLowerInvariant())" >> $env:GITHUB_ENV

      - name: Setup .NET SDK
        if: env.DOTNET_SDK_PRESENT != 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.301
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Beta test signing certificate
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $profile = Get-Content -Raw 'scripts/release-profiles/Beta.json' | ConvertFrom-Json
          if ([string]::IsNullOrWhiteSpace([string]$profile.PackageName)) { throw 'Beta package identity is missing.' }
          if ([string]$profile.PackageName -cne 'WinoMail.Beta') { throw "Unexpected Beta package identity: $($profile.PackageName)" }
          if ([string]::IsNullOrWhiteSpace([string]$profile.Publisher)) { throw 'Beta publisher identity is missing.' }

          $certDir = Join-Path $env:GITHUB_WORKSPACE 'artifacts\certificate'
          New-Item -ItemType Directory -Path $certDir -Force | Out-Null
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject ([string]$profile.Publisher) -KeyAlgorithm RSA -KeyLength 2048 -HashAlgorithm SHA256 -CertStoreLocation 'Cert:\CurrentUser\My' -KeyExportPolicy Exportable -NotAfter (Get-Date).AddDays(30)

          if ($null -eq $cert -or -not $cert.HasPrivateKey) { throw 'The Beta test signing certificate was not created with a private key.' }
          "BETA_TEST_CERT_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV
          if ($cert.Subject -cne [string]$profile.Publisher) { throw "Beta certificate subject mismatch: $($cert.Subject)" }

      - name: Build signed x64 Beta MSIXBundle
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $profile = Get-Content -Raw 'scripts/release-profiles/Beta.json' | ConvertFrom-Json
          if ([string]$profile.PackageName -cne 'WinoMail.Beta') { throw 'Beta release profile must use WinoMail.Beta.' }

          & ./scripts/build-releases.ps1 -NonInteractive -Beta -Architectures x64 -BetaAssetsPath (Join-Path $env:GITHUB_WORKSPACE 'release-assets\Beta') -BetaTestCertificateThumbprint $env:BETA_TEST_CERT_THUMBPRINT
          if ($LASTEXITCODE -ne 0) { throw 'x64 Beta MSIXBundle build failed.' }

          $bundles = @(Get-ChildItem -LiteralPath 'src/Wino.Mail.WinUI/AppPackages' -Filter 'WinoMail_Beta_*.msixbundle' -File -Recurse)
          if ($bundles.Count -ne 1) { throw "Expected exactly one Beta MSIXBundle, found $($bundles.Count)." }
          $certs = @(Get-ChildItem -LiteralPath 'src/Wino.Mail.WinUI/AppPackages' -Filter 'WinoMail_Beta_*_SigningCertificate.cer' -File -Recurse)
          if ($certs.Count -ne 1) { throw "Expected exactly one Beta signing certificate, found $($certs.Count)." }

          "BUNDLE_PATH=$($bundles[0].FullName)" >> $env:GITHUB_ENV
          "CERT_PATH=$($certs[0].FullName)" >> $env:GITHUB_ENV

      - name: Validate Beta identity and branding
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $profile = Get-Content -Raw 'scripts/release-profiles/Beta.json' | ConvertFrom-Json

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $bundleArchive = [System.IO.Compression.ZipFile]::OpenRead($env:BUNDLE_PATH)
          try {
            $bundleEntry = $bundleArchive.GetEntry('AppxMetadata/AppxBundleManifest.xml')
            if ($null -eq $bundleEntry) { throw 'The Beta bundle is missing AppxBundleManifest.xml.' }
            $reader = New-Object System.IO.StreamReader($bundleEntry.Open())
            try { [xml]$bundleManifest = $reader.ReadToEnd() } finally { $reader.Dispose() }

            $identity = $bundleManifest.Bundle.Identity
            if ([string]$identity.Name -cne [string]$profile.PackageName) { throw "Beta bundle identity name mismatch: $($identity.Name)" }
            if ([string]$identity.Publisher -cne [string]$profile.Publisher) { throw 'Beta bundle publisher mismatch.' }

            $packages = @($bundleManifest.Bundle.Packages.Package | Where-Object { $_.Type -eq 'application' })
            if ($packages.Count -ne 1) { throw "Expected one x64 application package in the Beta bundle, found $($packages.Count)." }
            $entry = $bundleArchive.GetEntry([string]$packages[0].FileName)
            if ($null -eq $entry) { throw 'The Beta bundle references a missing x64 package.' }

            $tempMsix = Join-Path $env:RUNNER_TEMP 'WinoMail.Beta.x64.msix'
            [System.IO.Compression.ZipFileExtensions]::ExtractToFile($entry, $tempMsix, $true)
          }
          finally {
            $bundleArchive.Dispose()
          }

          $msix = [System.IO.Compression.ZipFile]::OpenRead($tempMsix)
          try {
            $manifestEntry = $msix.GetEntry('AppxManifest.xml')
            if ($null -eq $manifestEntry) { throw 'The Beta MSIX is missing AppxManifest.xml.' }
            $reader = New-Object System.IO.StreamReader($manifestEntry.Open())
            try { [xml]$manifest = $reader.ReadToEnd() } finally { $reader.Dispose() }

            if ([string]$manifest.Package.Identity.Name -cne [string]$profile.PackageName) { throw 'Inner Beta package identity name mismatch.' }
            if ([string]$manifest.Package.Identity.Publisher -cne [string]$profile.Publisher) { throw 'Inner Beta package publisher mismatch.' }
            if ([string]$manifest.Package.Properties.DisplayName -cne [string]$profile.DisplayNames.Mail) { throw 'Beta root display name mismatch.' }

            $expectedNames = @{
              App = 'Mail'
              CalendarApp = 'Calendar'
              ContactsApp = 'People'
              ToDoApp = 'Tasks'
              MailNotificationHost = 'Mail'
              CalendarNotificationHost = 'Calendar'
              PeopleNotificationHost = 'People'
              ToDoNotificationHost = 'Tasks'
            }

            foreach ($app in $manifest.Package.Applications.Application) {
              $mode = $expectedNames[[string]$app.Id]
              if (-not $mode) { throw "Unknown application in Beta manifest: $($app.Id)" }
              $visual = $app.SelectSingleNode("*[local-name()='VisualElements"]")
              if ($visual.GetAttribute('DisplayName') -cne [string]$profile.DisplayNames.$mode) { throw "Beta display name mismatch for $($app.Id)." }
              foreach ($node in $app.SelectNodes(".//*[local-name()='ToastNotificationActivation']")) {
                if ($node.GetAttribute('ToastActivatorCLSID') -cne [string]$profile.NotificationActivatorIds.$mode) { throw "Beta toast activator identity mismatch for $($app.Id)." }
              }
              foreach ($node in $app.SelectNodes(".//*[local-name()='Class']")) {
                if ($node.GetAttribute('Id') -cne [string]$profile.NotificationActivatorIds.$mode) { throw "Beta COM activator identity mismatch for $($app.Id)." }
              }
            }

            if ($null -eq $msix.GetEntry('release-profile.json')) { throw 'The Beta MSIX is missing release-profile.json.' }
          }
          finally {
            $msix.Dispose()
          }

          Write-Host "Validated Beta identity: $($profile.PackageName)"
          Write-Host "Validated Beta display name: $($profile.DisplayNames.Mail)"

      - name: Install Beta signing certificate
        shell: pwsh
        run: |
          $profile = Get-Content -Raw 'scripts/release-profiles/Beta.json' | ConvertFrom-Json
          Import-Certificate -FilePath $env:CERT_PATH -CertStoreLocation 'Cert:\LocalMachine\TrustedPeople' -ErrorAction Stop | Out-Null
          $trusted = Get-Item -LiteralPath "Cert:\LocalMachine\TrustedPeople\$env:BETA_TEST_CERT_THUMBPRINT" -ErrorAction SilentlyContinue
          if ($null -eq $trusted) { throw 'The Beta package signer certificate was not trusted successfully.' }
          if ($trusted.Subject -cne [string]$profile.Publisher) { throw 'The trusted Beta certificate subject does not match Beta.json.' }

      - name: Install signed Beta MSIXBundle
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $identityName = 'WinoMail.Beta'
          Get-AppxPackage -Name $identityName -ErrorAction SilentlyContinue | ForEach-Object { Remove-AppxPackage -Package $_.PackageFullName -ErrorAction SilentlyContinue }

          $dependencyRoot = Join-Path (Split-Path $env:BUNDLE_PATH) 'Dependencies'
          $dependencyFiles = @(Get-ChildItem -LiteralPath $dependencyRoot -File -Recurse -ErrorAction SilentlyContinue | Where-Object { $_.Extension -in @('.appx', '.msix') })
          if ($dependencyFiles.Count -gt 0) {
            Add-AppxPackage -Path $env:BUNDLE_PATH -DependencyPath @($dependencyFiles.FullName) -ForceApplicationShutdown -ErrorAction Stop
          }
          else {
            Add-AppxPackage -Path $env:BUNDLE_PATH -ForceApplicationShutdown -ErrorAction Stop
          }

          $installed = @(Get-AppxPackage -Name $identityName -ErrorAction Stop)
          if ($installed.Count -ne 1) { throw "Expected exactly one installed $identityName package, found $($installed.Count)." }
          $installedManifest = Get-AppxPackageManifest $installed[0]
          if ([string]$installedManifest.Package.Identity.Name -cne $identityName) { throw 'Installed package identity is not WinoMail.Beta.' }
          if ([string]$installedManifest.Package.Properties.DisplayName -cne 'Wino Mail Beta') { throw 'Installed package display name is not Wino Mail Beta.' }

          $hostPath = Join-Path $installed[0].InstallLocation 'BackgroundSyncHost\Wino.Mail.BackgroundSyncHost.exe'
          if (-not (Test-Path -LiteralPath $hostPath -PathType Leaf)) { throw "Installed Beta package is missing the background sync host: $hostPath" }

      - name: Uninstall Beta package and remove test trust
        if: always()
        shell: pwsh
        run: |
          Get-AppxPackage -Name 'WinoMail.Beta' -ErrorAction SilentlyContinue | ForEach-Object {
            Remove-AppxPackage -Package $_.PackageFullName -ErrorAction SilentlyContinue
          }
          if ($env:BETA_TEST_CERT_THUMBPRINT) {
            Get-ChildItem 'Cert:\LocalMachine\TrustedPeople' -ErrorAction SilentlyContinue | Where-Object { $_.Thumbprint -eq $env:BETA_TEST_CERT_THUMBPRINT } | ForEach-Object { Remove-Item -LiteralPath "Cert:\LocalMachine\TrustedPeople\$($_.Thumbprint)" -Force }
            Get-ChildItem 'Cert:\CurrentUser\My' -ErrorAction SilentlyContinue | Where-Object { $_.Thumbprint -eq $env:BETA_TEST_CERT_THUMBPRINT } | ForEach-Object { Remove-Item -LiteralPath "Cert:\CurrentUser\My\$($_.Thumbprint)" -Force }
          }

      - name: Upload installable Beta artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WinoMail-Beta-x64-Installable
          path: |
            src/Wino.Mail.WinUI/AppPackages/WinoMail_Beta_*/*.msixbundle
            src/Wino.Mail.WinUI/AppPackages/WinoMail_Beta_*/*_SigningCertificate.cer
          if-no-files-found: error
