name: Publish verified GitHub Release

on:
  push:
    branches:
      - integration/msix-release-upstream-main
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/release/**'
      - 'release-assets/Beta/**'
      - 'Directory.*'
      - 'WinoMail.slnx'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-github-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish only the fully verified commit
    if: github.ref == 'refs/heads/integration/msix-release-upstream-main'
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Wait for required workflows on this exact commit
        id: gate
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          $deadline = (Get-Date).AddMinutes(120)
          $required = @('Native AOT Compatibility', 'Background notification runtime smoke')
          $matched = @{}
          while ((Get-Date) -lt $deadline) {
            $response = gh api "repos/$env:REPOSITORY/actions/runs?head_sha=$env:COMMIT_SHA&per_page=100"
            if ($LASTEXITCODE -ne 0) { throw 'Could not query Actions runs for the release commit.' }
            $runs = ($response | ConvertFrom-Json).workflow_runs
            foreach ($name in $required) {
              $run = $runs | Where-Object { $_.name -eq $name -and $_.head_sha -eq $env:COMMIT_SHA } | Sort-Object created_at -Descending | Select-Object -First 1
              if ($null -ne $run) { $matched[$name] = $run }
            }
            if ($matched.Count -eq 2 -and @($required | Where-Object { $matched[$_].status -ne 'completed' }).Count -eq 0) { break }
            Start-Sleep -Seconds 20
          }
          if ($matched.Count -ne 2) { throw 'Both required workflows did not start for this exact commit; refusing to publish.' }
          foreach ($name in $required) {
            $run = $matched[$name]
            Write-Host "$name run $($run.id): $($run.status)/$($run.conclusion), SHA $($run.head_sha)"
            if ($run.status -ne 'completed' -or $run.conclusion -ne 'success' -or $run.head_sha -ne $env:COMMIT_SHA) {
              throw "Required verification failed for '$name'; refusing to publish."
            }
          }
          $runtimeRun = $matched['Background notification runtime smoke']
          "RUNTIME_RUN_ID=$($runtimeRun.id)" >> $env:GITHUB_ENV

      - name: Download the already-tested MSIXBundle artifact
        uses: actions/download-artifact@v4
        with:
          name: Installable-Beta-MSIXBundle
          path: ${{ runner.temp }}/verified-msix
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.RUNTIME_RUN_ID }}

      - name: Validate artifact and publish versioned Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          $manifest = [xml](Get-Content -LiteralPath 'src/Wino.Mail.WinUI/Package.appxmanifest' -Raw)
          $version = [string]$manifest.Package.Identity.Version
          if ($version -notmatch '^[1-9]\d*\.\d+\.\d+\.0$') { throw "Invalid package version: $version" }
          $tag = "beta/v$version"
          $assets = Join-Path $env:RUNNER_TEMP 'verified-msix'
          $bundle = Get-ChildItem -LiteralPath $assets -Recurse -Filter "WinoMail_Beta_$version.msixbundle" | Select-Object -First 1
          $certificate = Get-ChildItem -LiteralPath $assets -Recurse -Filter 'WinoMail_Beta_TestCertificate.cer' | Select-Object -First 1
          if (-not $bundle -or -not $certificate) { Get-ChildItem -LiteralPath $assets -Recurse | Format-Table FullName; throw 'Verified bundle or matching test certificate missing from runtime workflow artifact.' }
          $notes = Join-Path $env:RUNNER_TEMP 'RELEASE-NOTES.md'
          @"
          Wino Mail Beta $version

          Published only after the Release build/tests/Native AOT/SQLite AOT workflow and the packaged Beta runtime smoke workflow both succeeded for commit $env:COMMIT_SHA.

          **Signing:** this bundle is signed with an ephemeral CI test certificate, not a trusted production signing certificate. The attached certificate is required to install this test build and must not be treated as a production trust root.
          
          Verified runtime workflow run: $env:RUNTIME_RUN_ID
          Commit: $env:COMMIT_SHA
          "@ | Set-Content -LiteralPath $notes -Encoding utf8
          $existing = gh release view $tag --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $bundle.FullName $certificate.FullName --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Failed to update existing Release assets.' }
            gh release edit $tag --title "Wino Mail Beta $version" --notes-file $notes --prerelease
            if ($LASTEXITCODE -ne 0) { throw 'Failed to update existing Release metadata.' }
          } else {
            gh release create $tag $bundle.FullName $certificate.FullName --title "Wino Mail Beta $version" --notes-file $notes --prerelease
            if ($LASTEXITCODE -ne 0) { throw 'Failed to create versioned Release.' }
          }
