name: Background notification runtime smoke

on:
  pull_request:
    paths:
      - 'src/Wino.Mail.BackgroundSyncHost/**'
      - 'src/Wino.Mail.WinUI/**'
      - 'src/Wino.NotificationHost.Contracts/**'
      - 'src/Wino.Platform.Windows/**'
      - 'src/Wino.Core/**'
      - 'src/Wino.Services/**'
      - 'src/Wino.Core.Domain/**'
      - 'src/Wino.SourceGenerators/**'
      - 'Directory.*'
      - 'WinoMail.slnx'
      - '.github/workflows/background-notification-runtime.yml'
      - 'scripts/build-releases.ps1'
  workflow_dispatch:

concurrency:
  group: background-notification-runtime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  notification-runtime:
    name: Install Beta package and test BackgroundSyncHost toast
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check installed .NET SDK
        shell: pwsh
        run: |
          $present = @(dotnet --list-sdks | Where-Object {
            if ($_ -match '^([0-9]+)\.([0-9]+)\.([0-9]+)\s') {
              return ([int]$Matches[1] -eq 10 -and [int]$Matches[2] -eq 0 -and [int]$Matches[3] -ge 301)
            }
            return $false
          }).Count -gt 0
          "DOTNET_SDK_PRESENT=$($present.ToString().ToLowerInvariant())" >> $env:GITHUB_ENV

      - name: Setup .NET SDK
        if: env.DOTNET_SDK_PRESENT != 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.301

      - name: Prepare Beta test certificate
        shell: pwsh
        run: |
          $profile = Get-Content -LiteralPath 'scripts/release-profiles/Beta.json' -Raw | ConvertFrom-Json
          if ($profile.Distribution -cne 'Beta' -or $profile.PackageName -cne 'WinoMail.Beta') { throw 'Beta release profile is not the expected WinoMail.Beta profile.' }
          if (-not (Test-Path 'release-assets/Beta/Assets/Wino_Icon.ico')) { throw 'Supply the beta artwork under release-assets/Beta before testing.' }
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject $profile.Publisher -KeyAlgorithm RSA -KeyLength 2048 -HashAlgorithm SHA256 -CertStoreLocation 'Cert:\CurrentUser\My' -KeyExportPolicy Exportable -NotAfter (Get-Date).AddDays(7)
          if ($null -eq $cert -or -not $cert.HasPrivateKey) { throw 'Could not create the Beta test signing certificate.' }
          "BETA_TEST_CERT_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV

      - name: Build installable Beta MSIXBundle
        shell: pwsh
        env:
          NuGetPackageSourceCredentials_github: Username=${{ github.actor }};Password=${{ secrets.GITHUB_TOKEN }}
        run: |
          pwsh -NoProfile -File .\\scripts\\build-releases.ps1 -NonInteractive -Beta -Architectures x64 -BetaTestCertificateThumbprint $env:BETA_TEST_CERT_THUMBPRINT
          if ($LASTEXITCODE -ne 0) { throw 'Beta MSIXBundle build failed.' }

          [xml]$sourceManifest = Get-Content -LiteralPath 'src/Wino.Mail.WinUI/Package.appxmanifest' -Raw
          $version = [string]$sourceManifest.Package.Identity.Version
          $releaseDir = Join-Path 'src/Wino.Mail.WinUI/AppPackages' "WinoMail_Beta_$version"
          $bundle = Join-Path $releaseDir "WinoMail_Beta_$version.msixbundle"

          if (-not (Test-Path -LiteralPath $bundle -PathType Leaf)) {
            throw "Installable Beta MSIXBundle was not produced: $bundle"
          }

          $certificate = Join-Path $releaseDir 'WinoMail_Beta_TestCertificate.cer'
          if (-not (Test-Path -LiteralPath $certificate -PathType Leaf)) { throw "Beta test certificate was not produced: $certificate" }
          "BUNDLE_PATH=$((Resolve-Path -LiteralPath $bundle).Path)" >> $env:GITHUB_ENV
          "CERTIFICATE_PATH=$((Resolve-Path -LiteralPath $certificate).Path)" >> $env:GITHUB_ENV
          "BETA_RELEASE_DIR=$((Resolve-Path -LiteralPath $releaseDir).Path)" >> $env:GITHUB_ENV

      - name: Install Beta test certificate and bundle
        shell: pwsh
        run: |
          Import-Certificate -FilePath $env:CERTIFICATE_PATH -CertStoreLocation 'Cert:\LocalMachine\TrustedPeople' -ErrorAction Stop | Out-Null
          Add-AppxPackage -Path $env:BUNDLE_PATH -ForceApplicationShutdown -ErrorAction Stop

          $package = Get-AppxPackage -Name 'WinoMail.Beta' -ErrorAction Stop
          "PACKAGE_FAMILY=$($package.PackageFamilyName)" >> $env:GITHUB_ENV
          $manifest = Get-AppxPackageManifest $package

          if ([string]$manifest.Package.Identity.Name -cne 'WinoMail.Beta') {
            throw 'Installed package is not the Beta package identity.'
          }

      - name: Upload installable Beta bundle
        uses: actions/upload-artifact@v4
        with:
          name: Installable-Beta-MSIXBundle
          path: ${{ env.BETA_RELEASE_DIR }}
          if-no-files-found: error

      - name: Uninstall Beta package
        if: always()
        shell: pwsh
        run: |
          Get-AppxPackage -Name 'WinoMail.Beta' -ErrorAction SilentlyContinue | ForEach-Object {
            Remove-AppxPackage -Package $_.PackageFullName -ErrorAction SilentlyContinue
          }
          if ($env:BETA_TEST_CERT_THUMBPRINT) {
            Get-ChildItem 'Cert:\LocalMachine\TrustedPeople' -ErrorAction SilentlyContinue | Where-Object Thumbprint -eq $env:BETA_TEST_CERT_THUMBPRINT | ForEach-Object { Remove-Item -LiteralPath "Cert:\LocalMachine\TrustedPeople\$($_.Thumbprint)" -Force -ErrorAction SilentlyContinue }
            Get-ChildItem 'Cert:\CurrentUser\My' -ErrorAction SilentlyContinue | Where-Object Thumbprint -eq $env:BETA_TEST_CERT_THUMBPRINT | ForEach-Object { Remove-Item -LiteralPath "Cert:\CurrentUser\My\$($_.Thumbprint)" -Force -ErrorAction SilentlyContinue }
          }
