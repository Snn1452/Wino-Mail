name: Background notification runtime smoke

on:
  pull_request:
    paths:
      - 'src/Wino.Mail.BackgroundSyncHost/**'
      - 'src/Wino.Mail.WinUI/**'
      - 'src/Wino.NotificationHost.Contracts/**'
      - 'src/Wino.Platform.Windows/**'
      - 'src/Wino.Core/**'
      - 'src/Wino.Services/**'
      - 'src/Wino.Core.Domain/**'
      - 'src/Wino.SourceGenerators/**'
      - 'Directory.*'
      - 'WinoMail.slnx'
  workflow_dispatch:

concurrency:
  group: background-notification-runtime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  notification-runtime:
    name: Install package and test BackgroundSyncHost toast
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check installed .NET SDK
        shell: pwsh
        run: |
          $present = @(dotnet --list-sdks | Where-Object {
            if ($_ -match '^([0-9]+)\.([0-9]+)\.([0-9]+)\s') {
              return ([int]$Matches[1] -eq 10 -and [int]$Matches[2] -eq 0 -and [int]$Matches[3] -ge 301)
            }
            return $false
          }).Count -gt 0
          "DOTNET_SDK_PRESENT=$($present.ToString().ToLowerInvariant())" >> $env:GITHUB_ENV

      - name: Setup .NET SDK
        if: env.DOTNET_SDK_PRESENT != 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.301

      - name: Read package publisher identity
        shell: pwsh
        run: |
          [xml]$manifest = Get-Content -LiteralPath 'src/Wino.Mail.WinUI/Package.appxmanifest' -Raw
          $publisher = [string]$manifest.Package.Identity.Publisher
          $packageName = [string]$manifest.Package.Identity.Name
          if ([string]::IsNullOrWhiteSpace($publisher)) { throw 'Manifest publisher is missing.' }
          "PACKAGE_PUBLISHER=$publisher" >> $env:GITHUB_ENV
          "PACKAGE_NAME=$packageName" >> $env:GITHUB_ENV

      - name: Create Store test certificate
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject $env:PACKAGE_PUBLISHER -KeyAlgorithm RSA -KeyLength 2048 -HashAlgorithm SHA256 -CertStoreLocation 'Cert:\CurrentUser\My' -KeyExportPolicy Exportable -NotAfter (Get-Date).AddDays(7)
          if ($null -eq $cert -or -not $cert.HasPrivateKey) { throw 'Could not create the test signing certificate.' }
          "CERT_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV

      - name: Build installable Store MSIXBundle
        shell: pwsh
        run: |
          pwsh -NoProfile -File .\scripts\build-releases.ps1 `
            -NonInteractive `
            -Store `
            -Architectures x64 `
            -StoreTestCertificateThumbprint $env:CERT_THUMBPRINT
          if ($LASTEXITCODE -ne 0) { throw 'Store MSIXBundle build failed.' }

          [xml]$sourceManifest = Get-Content -LiteralPath 'src/Wino.Mail.WinUI/Package.appxmanifest' -Raw
          $version = [string]$sourceManifest.Package.Identity.Version
          $releaseDir = Join-Path 'src/Wino.Mail.WinUI/AppPackages' "WinoMail_Store_$version"
          $bundle = Join-Path $releaseDir "WinoMail_Store_$version.msixbundle"
          $certificate = Join-Path $releaseDir 'WinoMail_Store_TestCertificate.cer'

          if (-not (Test-Path -LiteralPath $bundle -PathType Leaf)) { throw "Installable Store MSIXBundle was not produced: $bundle" }
          if (-not (Test-Path -LiteralPath $certificate -PathType Leaf)) { throw "Store test certificate was not produced: $certificate" }

          "BUNDLE_PATH=$((Resolve-Path -LiteralPath $bundle).Path)" >> $env:GITHUB_ENV
          "CERTIFICATE_PATH=$((Resolve-Path -LiteralPath $certificate).Path)" >> $env:GITHUB_ENV
          "STORE_RELEASE_DIR=$((Resolve-Path -LiteralPath $releaseDir).Path)" >> $env:GITHUB_ENV

      - name: Install test certificate and Store bundle
        shell: pwsh
        run: |
          Import-Certificate -FilePath $env:CERTIFICATE_PATH -CertStoreLocation 'Cert:\LocalMachine\TrustedPeople' -ErrorAction Stop | Out-Null
          Add-AppxPackage -Path $env:BUNDLE_PATH -ForceApplicationShutdown -ErrorAction Stop

          $package = Get-AppxPackage -Name $env:PACKAGE_NAME -ErrorAction Stop
          "PACKAGE_FAMILY=$($package.PackageFamilyName)" >> $env:GITHUB_ENV
          $manifest = Get-AppxPackageManifest $package
          if ([string]$manifest.Package.Identity.Name -cne $env:PACKAGE_NAME) { throw 'Installed package identity mismatch.' }

      - name: Upload installable Store bundle and certificate
        uses: actions/upload-artifact@v4
        with:
          name: Installable-MSIXBundle
          path: |
            ${{ env.BUNDLE_PATH }}
            ${{ env.CERTIFICATE_PATH }}
          if-no-files-found: error
      - name: Run background notification smoke while UI is open
        shell: pwsh
        run: |
          $package = Get-AppxPackage -Name $env:PACKAGE_NAME -ErrorAction Stop
          $exe = Join-Path $package.InstallLocation 'Wino.Mail.WinUI.exe'
          $backgroundHostPath = Join-Path $package.InstallLocation 'BackgroundSyncHost\Wino.Mail.BackgroundSyncHost.exe'
          if (-not (Test-Path -LiteralPath $backgroundHostPath)) { throw 'BackgroundSyncHost payload is missing.' }

          $targetAumid = "$($package.PackageFamilyName)!App"
          Write-Host "Launching packaged UI through $targetAumid"

          Start-Process -FilePath "$env:WINDIR\explorer.exe" -ArgumentList "shell:AppsFolder\$targetAumid" | Out-Null

          $ui = $null
          for ($attempt = 0; $attempt -lt 20 -and $null -eq $ui; $attempt++) {
            Start-Sleep -Seconds 1
            $ui = Get-Process -Name 'Wino.Mail.WinUI' -ErrorAction SilentlyContinue | Select-Object -First 1
          }

          if ($null -eq $ui) { throw 'Packaged Wino Mail UI process did not start.' }

          $smokeProcess = Start-Process -FilePath $backgroundHostPath -ArgumentList '--notification-smoke-test' -WorkingDirectory $package.InstallLocation -PassThru -Wait
          $smokeExitCode = $smokeProcess.ExitCode

          foreach ($diagnosticPath in @(
            (Join-Path $env:LOCALAPPDATA 'Wino Mail/background-sync-host-startup.log'),
            (Join-Path $env:TEMP 'Wino Mail/background-sync-host-startup.log')
          )) {
            if (Test-Path -LiteralPath $diagnosticPath -PathType Leaf) {
              Write-Host "BackgroundSyncHost diagnostic: $diagnosticPath"
              Get-Content -LiteralPath $diagnosticPath -Tail 80
            }
          }

          if ($smokeExitCode -ne 0) { throw "Background notification smoke failed while UI was open with exit code $smokeExitCode." }
          Start-Sleep -Seconds 3
          if ($ui.HasExited) { throw 'UI process exited unexpectedly during the background notification smoke.' }
          Stop-Process -Id $ui.Id -Force -ErrorAction SilentlyContinue

      - name: Run background notification smoke with UI closed
        shell: pwsh
        run: |
          $package = Get-AppxPackage -Name $env:PACKAGE_NAME -ErrorAction Stop
          $backgroundHostPath = Join-Path $package.InstallLocation 'BackgroundSyncHost\Wino.Mail.BackgroundSyncHost.exe'
          & $backgroundHostPath '--notification-smoke-test'
          $smokeExitCode = $LASTEXITCODE

          foreach ($diagnosticPath in @(
            (Join-Path $env:LOCALAPPDATA 'Wino Mail/background-sync-host-startup.log'),
            (Join-Path $env:TEMP 'Wino Mail/background-sync-host-startup.log')
          )) {
            if (Test-Path -LiteralPath $diagnosticPath -PathType Leaf) {
              Write-Host "BackgroundSyncHost diagnostic: $diagnosticPath"
              Get-Content -LiteralPath $diagnosticPath -Tail 80
            }
          }

          if ($smokeExitCode -ne 0) { throw "Background notification smoke failed while UI was closed with exit code $smokeExitCode." }

      - name: Uninstall package and remove certificate
        if: always()
        shell: pwsh
        run: |
          Get-AppxPackage -Name $env:PACKAGE_NAME -ErrorAction SilentlyContinue | ForEach-Object {
            Remove-AppxPackage -Package $_.PackageFullName -ErrorAction SilentlyContinue
          }
          if ($env:CERT_THUMBPRINT) {
            Get-ChildItem 'Cert:\LocalMachine\TrustedPeople' -ErrorAction SilentlyContinue | Where-Object Thumbprint -eq $env:CERT_THUMBPRINT | ForEach-Object { Remove-Item -LiteralPath "Cert:\LocalMachine\TrustedPeople\$($_.Thumbprint)" -Force }
            Get-ChildItem 'Cert:\CurrentUser\My' -ErrorAction SilentlyContinue | Where-Object Thumbprint -eq $env:CERT_THUMBPRINT | ForEach-Object { Remove-Item -LiteralPath "Cert:\CurrentUser\My\$($_.Thumbprint)" -Force }
          }
