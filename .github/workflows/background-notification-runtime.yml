name: Background notification runtime smoke

on:
  pull_request:
    paths:
      - 'src/Wino.Mail.BackgroundSyncHost/**'
      - 'src/Wino.Mail.WinUI/**'
      - 'src/Wino.NotificationHost.Contracts/**'
      - 'src/Wino.Platform.Windows/**'
      - 'src/Wino.Core/**'
      - 'src/Wino.Services/**'
      - 'src/Wino.Core.Domain/**'
      - 'src/Wino.SourceGenerators/**'
      - 'Directory.*'
      - 'WinoMail.slnx'
  workflow_dispatch:

concurrency:
  group: background-notification-runtime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  notification-runtime:
    name: Install Beta package and test BackgroundSyncHost toast
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      WINO_BETA_RELEASE_SIGNING_ENDPOINT: ${{ secrets.WINO_BETA_RELEASE_SIGNING_ENDPOINT }}
      WINO_BETA_RELEASE_SIGNING_ACCOUNT_NAME: ${{ secrets.WINO_BETA_RELEASE_SIGNING_ACCOUNT_NAME }}
      WINO_BETA_RELEASE_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ secrets.WINO_BETA_RELEASE_SIGNING_CERTIFICATE_PROFILE_NAME }}
      WINO_BETA_RELEASE_PUBLISHER_SUBJECT: ${{ secrets.WINO_BETA_RELEASE_PUBLISHER_SUBJECT }}
      WINO_BETA_RELEASE_AZURE_TENANT_ID: ${{ secrets.WINO_BETA_RELEASE_AZURE_TENANT_ID }}
      WINO_BETA_RELEASE_AZURE_CLIENT_ID: ${{ secrets.WINO_BETA_RELEASE_AZURE_CLIENT_ID }}
      WINO_BETA_RELEASE_AZURE_CLIENT_SECRET: ${{ secrets.WINO_BETA_RELEASE_AZURE_CLIENT_SECRET }}
      WINO_BETA_RELEASE_APPINSTALLER_URI: ${{ vars.WINO_BETA_RELEASE_APPINSTALLER_URI }}
      WINO_BETA_RELEASE_PACKAGE_BASE_URI: ${{ vars.WINO_BETA_RELEASE_PACKAGE_BASE_URI }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check installed .NET SDK
        shell: pwsh
        run: |
          $present = @(dotnet --list-sdks | Where-Object {
            if ($_ -match '^([0-9]+)\.([0-9]+)\.([0-9]+)\s') {
              return ([int]$Matches[1] -eq 10 -and [int]$Matches[2] -eq 0 -and [int]$Matches[3] -ge 301)
            }
            return $false
          }).Count -gt 0
          "DOTNET_SDK_PRESENT=$($present.ToString().ToLowerInvariant())" >> $env:GITHUB_ENV

      - name: Setup .NET SDK
        if: env.DOTNET_SDK_PRESENT != 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.301

      - name: Read package publisher identity
        shell: pwsh
        run: |
          [xml]$manifest = Get-Content -LiteralPath 'src/Wino.Mail.WinUI/Package.appxmanifest' -Raw
          $publisher = [string]$manifest.Package.Identity.Publisher
          $packageName = [string]$manifest.Package.Identity.Name
          if ([string]::IsNullOrWhiteSpace($publisher)) { throw 'Manifest publisher is missing.' }
          "PACKAGE_PUBLISHER=$publisher" >> $env:GITHUB_ENV
          "PACKAGE_NAME=$packageName" >> $env:GITHUB_ENV

      - name: Check beta artwork
        shell: pwsh
        run: |
          if (-not (Test-Path 'release-assets/Beta/Assets/Wino_Icon.ico')) {
            throw 'Supply the beta artwork under release-assets/Beta before testing.'
          }

      - name: Install Artifact Signing client
        shell: pwsh
        run: |
          nuget install Microsoft.Trusted.Signing.Client -Version 1.0.95 -Source https://api.nuget.org/v3/index.json -OutputDirectory "$env:RUNNER_TEMP/signing" -NonInteractive
          if ($LASTEXITCODE -ne 0) { throw 'Artifact Signing client installation failed.' }
          $dlib = Get-ChildItem "$env:RUNNER_TEMP/signing" -Filter Azure.CodeSigning.Dlib.dll -Recurse |
            Where-Object { $_.FullName -match '[\\/]x64[\\/]' } | Select-Object -First 1
          if (-not $dlib) { throw 'The x64 Artifact Signing library was not found.' }
          "WINO_BETA_RELEASE_SIGNING_DLIB_PATH=$($dlib.FullName)" >> $env:GITHUB_ENV

      - name: Build installable Beta MSIXBundle
        shell: pwsh
        env:
          NuGetPackageSourceCredentials_github: Username=${{ github.actor }};Password=${{ secrets.GITHUB_TOKEN }}
        run: |
          pwsh -NoProfile -File .\\scripts\\build-releases.ps1 `
            -NonInteractive `
            -Beta `
            -Architectures x64
          if ($LASTEXITCODE -ne 0) { throw 'Beta MSIXBundle build failed.' }

          [xml]$sourceManifest = Get-Content -LiteralPath 'src/Wino.Mail.WinUI/Package.appxmanifest' -Raw
          $version = [string]$sourceManifest.Package.Identity.Version
          $releaseDir = Join-Path 'src/Wino.Mail.WinUI/AppPackages' "WinoMail_Beta_$version"
          $bundle = Join-Path $releaseDir "WinoMail_Beta_$version.msixbundle"

          if (-not (Test-Path -LiteralPath $bundle -PathType Leaf)) {
            throw "Installable Beta MSIXBundle was not produced: $bundle"
          }

          "BUNDLE_PATH=$((Resolve-Path -LiteralPath $bundle).Path)" >> $env:GITHUB_ENV
          "BETA_RELEASE_DIR=$((Resolve-Path -LiteralPath $releaseDir).Path)" >> $env:GITHUB_ENV

      - name: Install signed Beta bundle
        shell: pwsh
        run: |
          Add-AppxPackage -Path $env:BUNDLE_PATH -ForceApplicationShutdown -ErrorAction Stop

          $package = Get-AppxPackage -Name 'WinoMail.Beta' -ErrorAction Stop
          "PACKAGE_FAMILY=$($package.PackageFamilyName)" >> $env:GITHUB_ENV
          $manifest = Get-AppxPackageManifest $package

          if ([string]$manifest.Package.Identity.Name -cne 'WinoMail.Beta') {
            throw 'Installed package is not the Beta package identity.'
          }

      - name: Upload installable Beta bundle
        uses: actions/upload-artifact@v4
        with:
          name: Installable-Beta-MSIXBundle
          path: ${{ env:BETA_RELEASE_DIR }}
          if-no-files-found: error

      - name: Uninstall Beta package
        if: always()
        shell: pwsh
        run: |
          Get-AppxPackage -Name 'WinoMail.Beta' -ErrorAction SilentlyContinue | ForEach-Object {
            Remove-AppxPackage -Package $_.PackageFullName -ErrorAction SilentlyContinue
          }
