name: Native AOT Compatibility

on:
  push:
    branches:
      - integration/msix-release-upstream-main
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/release/**'
      - 'Directory.*'
      - 'WinoMail.slnx'
      - 'global.json'
      - 'nuget.config'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: native-aot-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-aot:
    name: Publish x64 and run SQLite AOT smoke test
    runs-on: windows-latest
    env:
      NUGET_CONFIG_PATH: ${{ github.workspace }}\nuget.config
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check installed .NET 10 SDK
        shell: pwsh
        run: |
          $hasCompatibleSdk = @(dotnet --list-sdks | Where-Object {
            if ($_ -match '^([0-9]+)\.([0-9]+)\.([0-9]+)\s') {
              return ([int]$Matches[1] -eq 10 -and [int]$Matches[2] -eq 0 -and [int]$Matches[3] -ge 301)
            }
            return $false
          }).Count -gt 0
          "DOTNET_SDK_PRESENT=$($hasCompatibleSdk.ToString().ToLowerInvariant())" >> $env:GITHUB_ENV

      - name: Setup .NET SDK
        if: env.DOTNET_SDK_PRESENT != 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.301
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Release solution without packaging
        shell: pwsh
        run: |
          dotnet build WinoMail.slnx `
            --configuration Release `
            /m:1 `
            /p:Platform=x64 `
            /p:UseNativeAot=false `
            /p:EnableMsixTooling=false `
            /p:GenerateAppxPackageOnBuild=false `
            /p:AppxPackageSigningEnabled=false `
            /p:RestoreConfigFile=$env:NUGET_CONFIG_PATH
          if ($LASTEXITCODE -ne 0) { throw 'Release solution build failed.' }

      - name: Run actual Release test projects
        shell: pwsh
        run: |
          $testProjects = @(
            'tests/Wino.Core.ML.Tests/Wino.Core.ML.Tests.csproj',
            'tests/Wino.Core.Tests/Wino.Core.Tests.csproj',
            'tests/Wino.Mail.Controls.Tests/Wino.Mail.Controls.Tests.csproj',
            'tests/Wino.Mail.ViewModels.Tests/Wino.Mail.ViewModels.Tests.csproj',
            'tests/Wino.NotificationHost.Tests/Wino.NotificationHost.Tests.csproj'
          )

          foreach ($project in $testProjects) {
            Write-Host "Running test project: $project"
            dotnet test $project `
              --configuration Release `
              --no-restore `
              /m:1 `
              /p:Platform=x64 `
              /p:UseNativeAot=false `
              --logger "console;verbosity=minimal"
            if ($LASTEXITCODE -ne 0) { throw "Test project failed: $project" }
          }

      - name: Restore x64 Native AOT projects
        shell: pwsh
        run: |
          dotnet restore src/Wino.Mail.WinUI/Wino.Mail.WinUI.csproj `
            --configfile $env:NUGET_CONFIG_PATH `
            -r win-x64 `
            -p:Platform=x64 `
            -p:Configuration=Release `
            -p:UseNativeAot=true
          if ($LASTEXITCODE -ne 0) { throw 'WinUI restore failed.' }

          dotnet restore tests/Wino.Services.AotSmoke/Wino.Services.AotSmoke.csproj `
            --configfile $env:NUGET_CONFIG_PATH `
            -r win-x64 `
            -p:Platform=x64
          if ($LASTEXITCODE -ne 0) { throw 'SQLite smoke harness restore failed.' }

      - name: Publish warning-clean Native AOT WinUI application
        shell: pwsh
        run: |
          dotnet publish src/Wino.Mail.WinUI/Wino.Mail.WinUI.csproj `
            --configuration Release `
            --no-restore `
            -r win-x64 `
            /m:1 `
            /p:Platform=x64 `
            /p:EnableMsixTooling=false `
            /p:GenerateAppxPackageOnBuild=false `
            /p:AppxPackageSigningEnabled=false `
            /p:TreatWarningsAsErrors=true `
            /p:TrimmerSingleWarn=false
          if ($LASTEXITCODE -ne 0) { throw 'WinUI Native AOT publish failed.' }

          $nativeExecutable = Get-ChildItem src/Wino.Mail.WinUI/bin/Release -Recurse -Filter Wino.Mail.WinUI.exe | Select-Object -First 1
          if (-not $nativeExecutable) { throw 'WinUI Native AOT executable was not generated.' }

      - name: Publish and run SQLite Native AOT smoke harness
        shell: pwsh
        run: |
          dotnet publish tests/Wino.Services.AotSmoke/Wino.Services.AotSmoke.csproj `
            --configuration Release `
            --no-restore `
            -r win-x64 `
            /p:Platform=x64 `
            /p:TreatWarningsAsErrors=true `
            /p:TrimmerSingleWarn=false
          if ($LASTEXITCODE -ne 0) { throw 'SQLite Native AOT publish failed.' }

          & tests/Wino.Services.AotSmoke/bin/x64/Release/net10.0/win-x64/publish/Wino.Services.AotSmoke.exe
          if ($LASTEXITCODE -ne 0) { throw 'SQLite Native AOT smoke test failed.' }
