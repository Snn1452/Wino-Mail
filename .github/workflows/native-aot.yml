name: Native AOT Compatibility

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: wino-native-aot-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  native-aot:
    name: Publish x64 and run SQLite AOT smoke test
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      NUGET_CONFIG_PATH: ${{ github.workspace }}\nuget.config
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: false
          persist-credentials: false

      - name: Verify installed .NET SDK
        shell: pwsh
        run: |
          $version = dotnet --version
          if ($LASTEXITCODE -ne 0) { throw 'dotnet is not available on the runner.' }
          if ($version -ne '10.0.401') { throw "Expected .NET SDK 10.0.401, found $version." }
          dotnet --info

      - name: Restore x64 Native AOT projects
        shell: pwsh
        run: |
          dotnet restore src/Wino.Mail.WinUI/Wino.Mail.WinUI.csproj `
            --configfile $env:NUGET_CONFIG_PATH `
            -r win-x64 `
            -p:Platform=x64 `
            -p:Configuration=Release `
            -p:UseNativeAot=true
          if ($LASTEXITCODE -ne 0) { throw 'WinUI restore failed.' }

          dotnet restore src/Wino.Mail.BackgroundSyncHost/Wino.Mail.BackgroundSyncHost.csproj `
            --configfile $env:NUGET_CONFIG_PATH `
            -r win-x64 `
            -p:Platform=x64
          if ($LASTEXITCODE -ne 0) { throw 'Background synchronization host restore failed.' }

          dotnet restore tests/Wino.Services.AotSmoke/Wino.Services.AotSmoke.csproj `
            --configfile $env:NUGET_CONFIG_PATH `
            -r win-x64 `
            -p:Platform=x64
          if ($LASTEXITCODE -ne 0) { throw 'SQLite smoke harness restore failed.' }

      - name: Build background synchronization host
        shell: pwsh
        run: |
          dotnet build src/Wino.Mail.BackgroundSyncHost/Wino.Mail.BackgroundSyncHost.csproj `
            --configuration Release `
            --no-restore `
            -r win-x64 `
            /p:Platform=x64 `
            /p:SelfContained=false `
            /p:PublishAot=false `
            /p:PublishTrimmed=false
          if ($LASTEXITCODE -ne 0) { throw 'Background synchronization host build failed.' }

      - name: Publish warning-clean Native AOT WinUI application
        shell: pwsh
        run: |
          dotnet publish src/Wino.Mail.WinUI/Wino.Mail.WinUI.csproj `
            --configuration Release `
            --no-restore `
            -r win-x64 `
            /m:1 `
            /p:Platform=x64 `
            /p:EnableMsixTooling=false `
            /p:GenerateAppxPackageOnBuild=false `
            /p:AppxPackageSigningEnabled=false `
            /p:WinoSkipBackgroundSyncHostBuild=true `
            /p:UseSharedCompilation=false `
            /p:TreatWarningsAsErrors=true `
            /p:TrimmerSingleWarn=false
          if ($LASTEXITCODE -ne 0) { throw 'WinUI Native AOT publish failed.' }

          $nativeExecutable = Get-ChildItem src/Wino.Mail.WinUI/bin/Release -Recurse -Filter Wino.Mail.WinUI.exe | Select-Object -First 1
          if (-not $nativeExecutable) { throw 'WinUI Native AOT executable was not generated.' }

      - name: Stop build helper processes
        if: always()
        shell: pwsh
        run: |
          Get-Process -Name VBCSCompiler,MSBuild,vctip,dotnet -ErrorAction SilentlyContinue |
            Stop-Process -Force -ErrorAction SilentlyContinue

      - name: Publish and run SQLite Native AOT smoke harness
        shell: pwsh
        run: |
          dotnet publish tests/Wino.Services.AotSmoke/Wino.Services.AotSmoke.csproj `
            --configuration Release `
            --no-restore `
            -r win-x64 `
            /p:Platform=x64 `
            /p:TreatWarningsAsErrors=true `
            /p:TrimmerSingleWarn=false
          if ($LASTEXITCODE -ne 0) { throw 'SQLite Native AOT publish failed.' }

          & tests/Wino.Services.AotSmoke/bin/x64/Release/net10.0/win-x64/publish/Wino.Services.AotSmoke.exe
          if ($LASTEXITCODE -ne 0) { throw 'SQLite Native AOT smoke test failed.' }

