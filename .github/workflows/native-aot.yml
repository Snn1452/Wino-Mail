name: Native AOT and installable Wino Mail MSIXBundle

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: wino-msixbundle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-install:
    name: Build, sign, and install x64 MSIXBundle
    runs-on: windows-2025
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Verify release tooling and package tests
        shell: pwsh
        run: |
          ./tests/scripts/Build-Releases.Tests.ps1

      - name: Create x64 Beta test certificate
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $profile = Get-Content -Raw 'scripts/release-profiles/Beta.json' | ConvertFrom-Json
          $publisher = [string]$profile.Publisher
          $certificate = New-SelfSignedCertificate -Type Custom -Subject $publisher -FriendlyName 'Wino Mail CI Test Signing Certificate' -KeyAlgorithm RSA -KeyLength 2048 -HashAlgorithm SHA256 -KeyUsage DigitalSignature -KeyExportPolicy Exportable -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3','2.5.29.19={text}') -CertStoreLocation 'Cert:\CurrentUser\My' -NotAfter (Get-Date).AddYears(2)

          if ($null -eq $certificate) { throw 'Failed to create the Beta test signing certificate.' }
          if ($certificate.Subject -cne $publisher) { throw "Generated certificate subject '$($certificate.Subject)' does not match '$publisher'." }

          $cerPath = Join-Path $env:RUNNER_TEMP 'WinoMail_Beta_TestCertificate.cer'
          Export-Certificate -Cert $certificate -FilePath $cerPath -Type CERT -Force | Out-Null
          Import-Certificate -FilePath $cerPath -CertStoreLocation 'Cert:\CurrentUser\TrustedPeople' | Out-Null

          "BETA_TEST_CERT_THUMBPRINT=$($certificate.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Created test certificate: $($certificate.Thumbprint)"
          Write-Host "Publisher: $publisher"

      - name: Build signed x64 MSIXBundle
        shell: pwsh
        env:
          NuGetPackageSourceCredentials_github: Username=${{ github.actor }};Password=${{ secrets.GITHUB_TOKEN }}
        run: |
          ./scripts/build-releases.ps1 -NonInteractive -Beta -Architectures x64 -BetaTestCertificateThumbprint $env:BETA_TEST_CERT_THUMBPRINT
          if ($LASTEXITCODE -ne 0) { throw 'Signed x64 Beta package build failed.' }

      - name: Verify bundle and signatures
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          Add-Type -AssemblyName System.IO.Compression.FileSystem

          $manifest = [xml](Get-Content -Raw 'src/Wino.Mail.WinUI/Package.appxmanifest')
          $version = [string]$manifest.Package.Identity.Version
          $folder = Join-Path 'src/Wino.Mail.WinUI/AppPackages' "WinoMail_Beta_$version"
          $bundle = Join-Path $folder "WinoMail_Beta_$version.msixbundle"
          $certificate = Join-Path $folder "WinoMail_Beta_${version}_SigningCertificate.cer"

          if (-not (Test-Path -LiteralPath $bundle -PathType Leaf)) { throw "MSIXBundle not found: $bundle" }
          if (-not (Test-Path -LiteralPath $certificate -PathType Leaf)) { throw "Signing certificate not found: $certificate" }

          $expectedPublisher = [string](Get-Content -Raw 'scripts/release-profiles/Beta.json' | ConvertFrom-Json).Publisher
          $outer = Get-AuthenticodeSignature -LiteralPath $bundle
          if ($outer.Status -ne 'Valid' -or $null -eq $outer.SignerCertificate) { throw "Bundle signature is not valid: $($outer.Status)" }
          if ($outer.SignerCertificate.Subject -cne $expectedPublisher) { throw "Unexpected bundle signer: $($outer.SignerCertificate.Subject)" }

          $bundleArchive = [IO.Compression.ZipFile]::OpenRead($bundle)
          try {
            $bundleManifestEntry = $bundleArchive.GetEntry('AppxMetadata/AppxBundleManifest.xml')
            if ($null -eq $bundleManifestEntry) { throw 'Bundle manifest is missing.' }

            $reader = [IO.StreamReader]::new($bundleManifestEntry.Open())
            try { $bundleManifest = [xml]$reader.ReadToEnd() } finally { $reader.Dispose() }

            if ([string]$bundleManifest.Bundle.Identity.Name -cne 'WinoMail.Beta') { throw 'Unexpected Beta package identity.' }
            if ([string]$bundleManifest.Bundle.Identity.Publisher -cne $expectedPublisher) { throw 'Bundle publisher mismatch.' }
            if ([string]$bundleManifest.Bundle.Identity.Version -cne $version) { throw 'Bundle version mismatch.' }

            $packages = @($bundleManifest.Bundle.Packages.Package | Where-Object { $_.Type -eq 'application' -and $_.Architecture -eq 'x64' })
            if ($packages.Count -ne 1) { throw 'Expected exactly one x64 application package.' }

            foreach ($package in $packages) {
              $tempPackage = Join-Path $env:RUNNER_TEMP ([IO.Path]::GetFileName([string]$package.FileName))
              [IO.Compression.ZipFileExtensions]::ExtractToFile($bundleArchive.GetEntry([string]$package.FileName), $tempPackage, $true)
              try {
                $innerSignature = Get-AuthenticodeSignature -LiteralPath $tempPackage
                if ($innerSignature.Status -ne 'Valid' -or $null -eq $innerSignature.SignerCertificate) { throw "Inner package signature is not valid: $($innerSignature.Status)" }
                if ($innerSignature.SignerCertificate.Subject -cne $expectedPublisher) { throw "Unexpected inner package signer: $($innerSignature.SignerCertificate.Subject)" }

                $innerArchive = [IO.Compression.ZipFile]::OpenRead($tempPackage)
                try {
                  $innerManifestEntry = $innerArchive.GetEntry('AppxManifest.xml')
                  if ($null -eq $innerManifestEntry) { throw 'Inner AppxManifest.xml is missing.' }
                  $reader = [IO.StreamReader]::new($innerManifestEntry.Open())
                  try { $innerManifest = [xml]$reader.ReadToEnd() } finally { $reader.Dispose() }

                  $startupTasks = @($innerManifest.SelectNodes("//*[local-name()='StartupTask']"))
                  if ($startupTasks.Count -ne 1) { throw 'Background startup task is missing.' }
                  $startupExtension = $startupTasks[0].ParentNode.ParentNode
                  if ([string]$startupExtension.GetAttribute('Executable') -cne 'Wino.Mail.BackgroundSyncHost.exe') { throw 'Background startup task target mismatch.' }
                  if ($null -eq $innerArchive.GetEntry('Wino.Mail.BackgroundSyncHost.exe')) { throw 'Background sync host executable is missing from the package.' }
                }
                finally { $innerArchive.Dispose() }
              }
              finally { Remove-Item -LiteralPath $tempPackage -Force -ErrorAction SilentlyContinue }
            }
          }
          finally { $bundleArchive.Dispose() }

          $installScript = Join-Path $folder 'Install-WinoMail-Beta.ps1'
          @'
          Set-StrictMode -Version Latest
          $root = Split-Path -Parent $MyInvocation.MyCommand.Path
          $certificate = Get-ChildItem -LiteralPath $root -Filter '*_SigningCertificate.cer' -File | Select-Object -First 1
          $bundle = Get-ChildItem -LiteralPath $root -Filter '*.msixbundle' -File | Select-Object -First 1
          if ($null -eq $certificate -or $null -eq $bundle) { throw 'Package folder is missing the certificate or MSIXBundle.' }
          Import-Certificate -FilePath $certificate.FullName -CertStoreLocation 'Cert:\CurrentUser\TrustedPeople' | Out-Null
          $dependencies = @(Get-ChildItem -LiteralPath (Join-Path $root 'Dependencies') -Recurse -File -ErrorAction SilentlyContinue | Where-Object { $_.Extension -in '.msix', '.appx' } | Select-Object -ExpandProperty FullName)
          if ($dependencies.Count -gt 0) { Add-AppxPackage -Path $bundle.FullName -DependencyPath $dependencies -ForceUpdateFromAnyVersion } else { Add-AppxPackage -Path $bundle.FullName -ForceUpdateFromAnyVersion }
          $installed = Get-AppxPackage -Name 'WinoMail.Beta'
          if ($null -eq $installed) { throw 'WinoMail.Beta was not installed.' }
          Write-Host "Installed $($installed.Name) $($installed.Version)."
          '@ | Set-Content -LiteralPath $installScript -Encoding utf8

      - name: Install signed bundle smoke test
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $manifest = [xml](Get-Content -Raw 'src/Wino.Mail.WinUI/Package.appxmanifest')
          $version = [string]$manifest.Package.Identity.Version
          $folder = Join-Path 'src/Wino.Mail.WinUI/AppPackages' "WinoMail_Beta_$version"
          $bundle = Join-Path $folder "WinoMail_Beta_$version.msixbundle"
          $certificate = Join-Path $folder "WinoMail_Beta_${version}_SigningCertificate.cer"

          Import-Certificate -FilePath $certificate -CertStoreLocation 'Cert:\CurrentUser\TrustedPeople' | Out-Null

          $dependencies = @(Get-ChildItem -LiteralPath (Join-Path $folder 'Dependencies') -Recurse -File -ErrorAction SilentlyContinue | Where-Object { $_.Extension -in '.msix', '.appx' } | Select-Object -ExpandProperty FullName)

          if ($dependencies.Count -gt 0) {
            Add-AppxPackage -Path $bundle -DependencyPath $dependencies -ForceUpdateFromAnyVersion
          }
          else {
            Add-AppxPackage -Path $bundle -ForceUpdateFromAnyVersion
          }

          $installed = Get-AppxPackage -Name 'WinoMail.Beta'
          if ($null -eq $installed) { throw 'WinoMail.Beta was not installed.' }
          if ([string]$installed.Version -ne $version) { throw "Installed version $($installed.Version) does not match $version." }

          Get-AppxPackage -Name 'WinoMail.Beta' | Remove-AppxPackage -ErrorAction Stop
          Write-Host "Installed and removed WinoMail.Beta $version successfully."

      - name: Upload installable MSIXBundle and certificate
        uses: actions/upload-artifact@v4
        with:
          name: WinoMail-Beta-x64-Installable
          path: src/Wino.Mail.WinUI/AppPackages/WinoMail_Beta_*
          if-no-files-found: error
          retention-days: 14
