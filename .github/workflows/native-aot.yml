name: Native AOT Compatibility

on:
  push:
    branches:
      - feature/background-sync-host
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  native-aot:
    name: Publish x64 and run SQLite AOT smoke test
    runs-on: windows-latest
    env:
      NUGET_CONFIG_PATH: ${{ github.workspace }}\nuget.config
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.301
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore x64 Native AOT projects
        shell: pwsh
        run: |
          dotnet restore src/Wino.Mail.WinUI/Wino.Mail.WinUI.csproj `
            --configfile $env:NUGET_CONFIG_PATH `
            -r win-x64 `
            -p:Platform=x64 `
            -p:Configuration=Release `
            -p:UseNativeAot=true
          if ($LASTEXITCODE -ne 0) { throw 'WinUI restore failed.' }

          dotnet restore tests/Wino.Services.AotSmoke/Wino.Services.AotSmoke.csproj `
            --configfile $env:NUGET_CONFIG_PATH `
            -r win-x64 `
            -p:Platform=x64
          if ($LASTEXITCODE -ne 0) { throw 'SQLite smoke harness restore failed.' }

          dotnet restore src/Wino.Platform.Windows/Wino.Platform.Windows.csproj --configfile $env:NUGET_CONFIG_PATH -r win-x64 -p:Platform=x64 -p:Configuration=Debug
          if ($LASTEXITCODE -ne 0) { throw 'Platform Windows Debug restore failed.' }

          dotnet restore src/Wino.Mail.BackgroundSyncHost/Wino.Mail.BackgroundSyncHost.csproj --configfile $env:NUGET_CONFIG_PATH -r win-x64 -p:Platform=x64 -p:Configuration=Debug -p:WinoIsReleaseBuild=false
          if ($LASTEXITCODE -ne 0) { throw 'Background sync host Debug restore failed.' }

      - name: Verify platform dependency build ordering
        shell: pwsh
        run: |
          dotnet build src/Wino.Platform.Windows/Wino.Platform.Windows.csproj `
            --configuration Debug `
            -r win-x64 `
            --no-restore `
            -m:4 `
            /p:Platform=x64 `
            /p:UseNativeAot=false `
            /p:WinoIsReleaseBuild=false
          if ($LASTEXITCODE -ne 0) { throw 'Parallel Wino.Platform.Windows Debug build failed.' }

      - name: Build x64 Debug WinUI dependency graph
        shell: pwsh
        run: |
          dotnet build src/Wino.Mail.WinUI/Wino.Mail.WinUI.csproj `
            --configuration Debug `
            -r win-x64 `
            --no-restore `
            /m:1 `
            /p:Platform=x64 `
            /p:UseNativeAot=false `
            /p:WinoIsReleaseBuild=false
          if ($LASTEXITCODE -ne 0) { throw 'WinUI Debug build failed.' }
      - name: Verify Debug platform dependency assembly is regenerated
        shell: pwsh
        run: |
          $platformAssembly = "src/Wino.Platform.Windows/bin/x64/Debug/net10.0-windows10.0.26100.0/win-x64/Wino.Platform.Windows.dll"
          if (-not (Test-Path $platformAssembly)) { throw 'Expected Wino.Platform.Windows implementation assembly was not produced by the first Debug build.' }
          Remove-Item $platformAssembly -Force

          dotnet build src/Wino.Mail.WinUI/Wino.Mail.WinUI.csproj `
            --configuration Debug `
            -r win-x64 `
            --no-restore `
            /m:1 `
            /p:Platform=x64 `
            /p:UseNativeAot=false `
            /p:WinoIsReleaseBuild=false
          if ($LASTEXITCODE -ne 0) { throw 'WinUI Debug build did not repair the missing platform dependency assembly.' }

          if (-not (Test-Path $platformAssembly)) {
            throw 'Wino.Platform.Windows implementation assembly was not regenerated after deletion.'
          }

      - name: Verify Debug packaged host runtime configuration
        shell: pwsh
        run: |
          $packageRoot = "src/Wino.Mail.WinUI/bin/x64/Debug/net10.0-windows10.0.26100.0/win-x64/AppX"
          $notificationConfig = Join-Path $packageRoot "Wino.Mail.NotificationHost.runtimeconfig.json"
          $backgroundConfig = Join-Path $packageRoot "BackgroundSyncHost/Wino.Mail.BackgroundSyncHost.runtimeconfig.json"

          foreach ($configPath in @($notificationConfig, $backgroundConfig)) {
            if (-not (Test-Path $configPath)) { throw "Missing Debug runtimeconfig: $configPath" }
            $runtimeConfig = Get-Content $configPath -Raw | ConvertFrom-Json
            if (-not $runtimeConfig.runtimeOptions.framework) {
              throw "Debug framework-dependent runtimeconfig is missing framework metadata: $configPath"
            }
          }

      - name: Publish warning-clean Native AOT WinUI application
        shell: pwsh
        run: |
          dotnet publish src/Wino.Mail.WinUI/Wino.Mail.WinUI.csproj `
            --configuration Release `
            --no-restore `
            -r win-x64 `
            /m:1 `
            /p:Platform=x64 `
            /p:EnableMsixTooling=false `
            /p:GenerateAppxPackageOnBuild=false `
            /p:AppxPackageSigningEnabled=false `
            /p:BackgroundSyncHostPublishRoot="$env:GITHUB_WORKSPACE\\src\\Wino.Mail.WinUI\\bin\\Release\\BackgroundSyncHost\\" `
            /p:WinoIsReleaseBuild=true `
            /p:TreatWarningsAsErrors=true `
            /p:TrimmerSingleWarn=false
          if ($LASTEXITCODE -ne 0) { throw 'WinUI Native AOT publish failed.' }

          $nativeExecutable = Get-ChildItem src/Wino.Mail.WinUI/bin/Release -Recurse -Filter Wino.Mail.WinUI.exe | Select-Object -First 1
          if (-not $nativeExecutable) { throw 'WinUI Native AOT executable was not generated.' }

          $backgroundHosts = @(Get-ChildItem src/Wino.Mail.WinUI/bin/Release -Recurse -Filter Wino.Mail.BackgroundSyncHost.exe)
          if ($backgroundHosts.Count -ne 1) {
            throw "Expected exactly one packaged BackgroundSyncHost executable, found $($backgroundHosts.Count)."
          }
          $backgroundHost = $backgroundHosts[0]
          Write-Host "BackgroundSyncHost payload: $($backgroundHost.FullName)"

      - name: Publish and run SQLite Native AOT smoke harness
        shell: pwsh
        env:
          WINO_MAGIKA_DIAGNOSTICS: '1'
        run: |
          dotnet publish tests/Wino.Services.AotSmoke/Wino.Services.AotSmoke.csproj `
            --configuration Release `
            --no-restore `
            -r win-x64 `
            /p:Platform=x64 `
            /p:TreatWarningsAsErrors=true `
            /p:TrimmerSingleWarn=false
          if ($LASTEXITCODE -ne 0) { throw 'SQLite Native AOT publish failed.' }

          & tests/Wino.Services.AotSmoke/bin/x64/Release/net10.0/win-x64/publish/Wino.Services.AotSmoke.exe
          if ($LASTEXITCODE -ne 0) { throw 'SQLite Native AOT smoke test failed.' }
