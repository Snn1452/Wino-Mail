name: Native AOT Compatibility

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  native-aot:
    name: Publish x64 and run SQLite AOT smoke test
    runs-on: windows-latest
    env:
      NUGET_CONFIG_PATH: ${{ github.workspace }}\nuget.config
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.301
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore x64 Native AOT projects
        shell: pwsh
        run: |
          dotnet restore src/Wino.Mail.WinUI/Wino.Mail.WinUI.csproj `
            --configfile $env:NUGET_CONFIG_PATH `
            -r win-x64 `
            -p:Platform=x64 `
            -p:Configuration=Release `
            -p:UseNativeAot=true
          if ($LASTEXITCODE -ne 0) { throw 'WinUI restore failed.' }

          dotnet restore tests/Wino.Services.AotSmoke/Wino.Services.AotSmoke.csproj `
            --configfile $env:NUGET_CONFIG_PATH `
            -r win-x64 `
            -p:Platform=x64
          if ($LASTEXITCODE -ne 0) { throw 'SQLite smoke harness restore failed.' }

          dotnet restore src/Wino.Platform.Windows/Wino.Platform.Windows.csproj --configfile $env:NUGET_CONFIG_PATH -r win-x64 -p:Platform=x64 -p:Configuration=Debug
          if ($LASTEXITCODE -ne 0) { throw 'Platform Windows Debug restore failed.' }

          dotnet restore src/Wino.Mail.BackgroundSyncHost/Wino.Mail.BackgroundSyncHost.csproj --configfile $env:NUGET_CONFIG_PATH -r win-x64 -p:Platform=x64 -p:Configuration=Debug -p:WinoIsReleaseBuild=false
          if ($LASTEXITCODE -ne 0) { throw 'Background sync host Debug restore failed.' }

      - name: Build x64 Debug WinUI dependency graph
        shell: pwsh
        run: |
          dotnet build src/Wino.Mail.WinUI/Wino.Mail.WinUI.csproj `
            --configuration Debug `
            -r win-x64 `
            --no-restore `
            /m:1 `
            /p:Platform=x64 `
            /p:UseNativeAot=false `
            /p:WinoIsReleaseBuild=false
          if ($LASTEXITCODE -ne 0) { throw 'WinUI Debug build failed.' }
      - name: Verify repair of missing platform reference assembly
        shell: pwsh
        run: |
          $platformRef = "src/Wino.Platform.Windows/obj/x64/Debug/net10.0-windows10.0.26100.0/win-x64/ref/Wino.Platform.Windows.dll"
          if (-not (Test-Path $platformRef)) { throw 'Expected Wino.Platform.Windows reference assembly was not produced by the first Debug build.' }
          Remove-Item $platformRef -Force

          dotnet build src/Wino.Mail.WinUI/Wino.Mail.WinUI.csproj `
            --configuration Debug `
            -r win-x64 `
            --no-restore `
            /m:1 `
            /p:Platform=x64 `
            /p:UseNativeAot=false `
            /p:WinoIsReleaseBuild=false
          if ($LASTEXITCODE -ne 0) { throw 'WinUI Debug build did not repair the missing platform reference assembly.' }

          if (-not (Test-Path $platformRef)) {
            throw 'Wino.Platform.Windows reference assembly was not regenerated after deletion.'
          }

      - name: Publish warning-clean Native AOT WinUI application
        shell: pwsh
        run: |
          dotnet publish src/Wino.Mail.WinUI/Wino.Mail.WinUI.csproj `
            --configuration Release `
            --no-restore `
            -r win-x64 `
            /m:1 `
            /p:Platform=x64 `
            /p:EnableMsixTooling=false `
            /p:GenerateAppxPackageOnBuild=false `
            /p:AppxPackageSigningEnabled=false `
            /p:TreatWarningsAsErrors=true `
            /p:TrimmerSingleWarn=false
          if ($LASTEXITCODE -ne 0) { throw 'WinUI Native AOT publish failed.' }

          $nativeExecutable = Get-ChildItem src/Wino.Mail.WinUI/bin/Release -Recurse -Filter Wino.Mail.WinUI.exe | Select-Object -First 1
          if (-not $nativeExecutable) { throw 'WinUI Native AOT executable was not generated.' }

          $backgroundHost = Get-ChildItem src/Wino.Mail.WinUI/bin/Release -Recurse -Filter Wino.Mail.BackgroundSyncHost.exe |
            Where-Object { $_.FullName -match '[\\/]BackgroundSyncHost[\\/]' } |
            Select-Object -First 1
          if (-not $backgroundHost) { throw 'Packaged BackgroundSyncHost executable was not generated.' }
          Write-Host "BackgroundSyncHost payload: $($backgroundHost.Directory.FullName)"

      - name: Publish and run SQLite Native AOT smoke harness
        shell: pwsh
        env:
          WINO_MAGIKA_DIAGNOSTICS: '1'
        run: |
          dotnet publish tests/Wino.Services.AotSmoke/Wino.Services.AotSmoke.csproj `
            --configuration Release `
            --no-restore `
            -r win-x64 `
            /p:Platform=x64 `
            /p:TreatWarningsAsErrors=true `
            /p:TrimmerSingleWarn=false
          if ($LASTEXITCODE -ne 0) { throw 'SQLite Native AOT publish failed.' }

          & tests/Wino.Services.AotSmoke/bin/x64/Release/net10.0/win-x64/publish/Wino.Services.AotSmoke.exe
          if ($LASTEXITCODE -ne 0) { throw 'SQLite Native AOT smoke test failed.' }
