name: Beta MSIXBundle

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - feature/background-sync-host
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-beta-msixbundle:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate beta packaging logic
        shell: pwsh
        run: ./tests/scripts/Build-Releases.Tests.ps1

      - name: Build beta MSIXBundle
        shell: pwsh
        env:
          NuGetPackageSourceCredentials_github: Username=${{ github.actor }};Password=${{ secrets.GITHUB_TOKEN }}
        run: |
          ./scripts/build-releases.ps1 -NonInteractive -Beta -UnsignedBeta -Architectures x64
          if ($LASTEXITCODE -ne 0) { throw 'Beta MSIXBundle build failed.' }

      - name: Verify beta bundle identity
        shell: pwsh
        run: |
          $bundles = @(Get-ChildItem 'src/Wino.Mail.WinUI/AppPackages' -Recurse -File -Filter 'WinoMail_Beta_*.msixbundle' |
            Where-Object { $_.Directory.Name -like 'WinoMail_Beta_*' })
          if ($bundles.Count -ne 1) { throw "Expected exactly one beta MSIXBundle, found $($bundles.Count)." }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [IO.Compression.ZipFile]::OpenRead($bundles[0].FullName)
          try {
            $entry = $archive.GetEntry('AppxMetadata/AppxBundleManifest.xml')
            if ($null -eq $entry) { throw 'The beta bundle is missing AppxBundleManifest.xml.' }
            $reader = [IO.StreamReader]::new($entry.Open())
            try { [xml]$manifest = $reader.ReadToEnd() } finally { $reader.Dispose() }
          }
          finally {
            $archive.Dispose()
          }

          $identity = $manifest.Bundle.Identity
          if ([string]$identity.Name -cne 'WinoMail.Beta') { throw "Unexpected beta package name: $($identity.Name)" }
          if ([string]$identity.Publisher -cne 'CN=Burak Kaan Köse, O=Burak Kaan Köse, L=Wroclaw, S=Dolnośląskie, C=PL') {
            throw "Unexpected beta publisher: $($identity.Publisher)"
          }

          $hash = (Get-FileHash -LiteralPath $bundles[0].FullName -Algorithm SHA256).Hash
          @(
            "Bundle=$($bundles[0].FullName)"
            "Version=$($identity.Version)"
            "PackageName=$($identity.Name)"
            "Publisher=$($identity.Publisher)"
            "Architecture=x64"
            "Signed=false"
            "SHA256=$hash"
            "Commit=${{ github.sha }}"
          ) | Set-Content "$env:GITHUB_WORKSPACE/beta-msixbundle-metadata.txt" -Encoding utf8


      - name: Sign and stage beta bundle for installation
        shell: pwsh
        run: |
          $bundle = Get-ChildItem 'src/Wino.Mail.WinUI/AppPackages' -Recurse -File -Filter 'WinoMail_Beta_*.msixbundle' |
            Where-Object { $_.Directory.Name -like 'WinoMail_Beta_*' } |
            Select-Object -First 1
          if ($null -eq $bundle) { throw 'Beta MSIXBundle not found for signing.' }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [IO.Compression.ZipFile]::OpenRead($bundle.FullName)
          try {
            $entry = $archive.GetEntry('AppxMetadata/AppxBundleManifest.xml')
            if ($null -eq $entry) { throw 'The beta bundle is missing AppxBundleManifest.xml.' }
            $reader = [IO.StreamReader]::new($entry.Open())
            try { [xml]$manifest = $reader.ReadToEnd() } finally { $reader.Dispose() }
          }
          finally { $archive.Dispose() }

          $publisher = [string]$manifest.Bundle.Identity.Publisher
          if ([string]::IsNullOrWhiteSpace($publisher)) { throw 'The beta bundle publisher is empty.' }

          $cert = New-SelfSignedCertificate -Type Custom -Subject $publisher -KeyAlgorithm RSA -KeyLength 2048 -HashAlgorithm SHA256 -KeyUsage DigitalSignature -CertStoreLocation 'Cert:\CurrentUser\My' -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3','2.5.29.19={critical}{text}CA=FALSE') -FriendlyName 'Wino Mail Beta CI Test Signing'
          if ($null -eq $cert -or -not $cert.HasPrivateKey) { throw 'The beta test signing certificate could not be created with a private key.' }
          if ($cert.Subject -cne $publisher) { throw "Certificate subject mismatch. Cert='$($cert.Subject)' Publisher='$publisher'" }

          $signToolRoot = Join-Path ([Environment]::GetEnvironmentVariable('ProgramFiles(x86)')) 'Windows Kits\10\bin'
          $signTool = Get-ChildItem $signToolRoot -Filter 'signtool.exe' -File -Recurse |
            Where-Object { $_.Directory.Name -eq 'x64' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if ($null -eq $signTool) { throw 'Windows SDK SignTool was not found.' }

          $cer = Join-Path $bundle.DirectoryName 'WinoMail_Beta.cer'
          Export-Certificate -Cert $cert -FilePath $cer | Out-Null
          Import-Certificate -FilePath $cer -CertStoreLocation 'Cert:\LocalMachine\TrustedPeople' | Out-Null

          & $signTool.FullName sign /fd SHA256 /sha1 $cert.Thumbprint $bundle.FullName
          if ($LASTEXITCODE -ne 0) { throw 'SignTool failed to sign the beta MSIXBundle.' }

          & $signTool.FullName verify /pa /all /v /tw $bundle.FullName
          if ($LASTEXITCODE -ne 0) { throw 'SignTool verification failed for the beta MSIXBundle.' }

          $signature = Get-AuthenticodeSignature -FilePath $bundle.FullName
          if ($null -eq $signature.SignerCertificate) { throw 'The signed beta MSIXBundle does not expose a signer certificate.' }
          if ($signature.SignerCertificate.Subject -cne $publisher) { throw "Signed certificate subject mismatch. Cert='$($signature.SignerCertificate.Subject)' Publisher='$publisher'" }

          $artifactRoot = Join-Path $env:RUNNER_TEMP 'WinoMail-Beta-MSIXBundle'
          if (Test-Path -LiteralPath $artifactRoot) { Remove-Item -LiteralPath $artifactRoot -Recurse -Force }
          $null = New-Item -ItemType Directory -Path $artifactRoot
          $null = New-Item -ItemType Directory -Path (Join-Path $artifactRoot 'Dependencies')

          Copy-Item -LiteralPath $bundle.FullName -Destination (Join-Path $artifactRoot $bundle.Name)
          Copy-Item -LiteralPath $cer -Destination (Join-Path $artifactRoot 'WinoMail_Beta.cer')

          $dependencyRoot = Join-Path $bundle.DirectoryName 'Dependencies'
          if (Test-Path -LiteralPath $dependencyRoot) {
            Copy-Item -LiteralPath $dependencyRoot -Destination $artifactRoot -Recurse
          }

          $installScript = @(
            '#requires -RunAsAdministrator'
            '[CmdletBinding()]'
            'param()'
            '$ErrorActionPreference = ''Stop'''
            '$root = $PSScriptRoot'
            '$bundle = Get-ChildItem -LiteralPath $root -File -Filter ''WinoMail_Beta_*.msixbundle'' | Select-Object -First 1'
            '$certificate = Join-Path $root ''WinoMail_Beta.cer'''
            '$dependencyRoot = Join-Path $root ''Dependencies'''
            'if ($null -eq $bundle) { throw ''Wino Mail Beta MSIXBundle was not found next to this script.'' }'
            'if (-not (Test-Path -LiteralPath $certificate -PathType Leaf)) { throw ''WinoMail_Beta.cer was not found next to this script.'' }'
            'Import-Certificate -FilePath $certificate -CertStoreLocation ''Cert:\LocalMachine\TrustedPeople'' | Out-Null'
            '$dependencies = @()'
            'if (Test-Path -LiteralPath $dependencyRoot -PathType Container) {'
            '  $dependencies = @(Get-ChildItem -LiteralPath $dependencyRoot -Recurse -File | Where-Object { $_.Extension -in ''.msix'', ''.appx'' } | Select-Object -ExpandProperty FullName)'
            '}'
            '$params = @{ Path = $bundle.FullName }'
            'if ($dependencies.Count -gt 0) { $params.DependencyPath = $dependencies }'
            'Add-AppxPackage @params'
            'Write-Host "Wino Mail Beta installed from $($bundle.Name)." -ForegroundColor Green'
          )
          $installScript | Set-Content -LiteralPath (Join-Path $artifactRoot 'Install-WinoMail-Beta.ps1') -Encoding utf8

          $readmeLines = @(
            'Wino Mail Beta — CI test package'
            ''
            '1. Extract this artifact.'
            '2. Open PowerShell as Administrator.'
            '3. Change directory to this folder.'
            '4. Run:'
            '   .\Install-WinoMail-Beta.ps1'
            ''
            'The installer imports WinoMail_Beta.cer into Local Computer / Trusted People, then installs the signed MSIXBundle and any dependency packages included in Dependencies.'
            ''
            'This certificate is a temporary self-signed CI test certificate for this artifact only.'
          )
          $readmeLines | Set-Content -LiteralPath (Join-Path $artifactRoot 'INSTALL.md') -Encoding utf8

          $metadataLines = @(
            "Bundle=$($bundle.Name)"
            "Version=$([string]$manifest.Bundle.Identity.Version)"
            "PackageName=$([string]$manifest.Bundle.Identity.Name)"
            "Publisher=$publisher"
            "Architecture=x64"
            'Signed=true'
            "CertificateSubject=$publisher"
            "CertificateThumbprint=$($cert.Thumbprint)"
            "SHA256=$((Get-FileHash -LiteralPath $bundle.FullName -Algorithm SHA256).Hash)"
            "Commit=$env:GITHUB_SHA"
          )
          $metadataLines | Set-Content -LiteralPath (Join-Path $artifactRoot 'beta-msixbundle-metadata.txt') -Encoding utf8

          Write-Host "Staged beta installer artifact at $artifactRoot"

      - name: Smoke test beta bundle installation
        shell: pwsh
        run: |
          $artifactRoot = Join-Path $env:RUNNER_TEMP 'WinoMail-Beta-MSIXBundle'
          $bundle = Get-ChildItem -LiteralPath $artifactRoot -File -Filter 'WinoMail_Beta_*.msixbundle' | Select-Object -First 1
          $certificate = Join-Path $artifactRoot 'WinoMail_Beta.cer'
          if ($null -eq $bundle) { throw 'Staged beta bundle was not found.' }
          if (-not (Test-Path -LiteralPath $certificate -PathType Leaf)) { throw 'Staged beta certificate was not found.' }

          Import-Certificate -FilePath $certificate -CertStoreLocation 'Cert:\LocalMachine\TrustedPeople' | Out-Null

          $dependencies = @()
          $dependencyRoot = Join-Path $artifactRoot 'Dependencies'
          if (Test-Path -LiteralPath $dependencyRoot) {
            $dependencies = @(Get-ChildItem -LiteralPath $dependencyRoot -Recurse -File |
              Where-Object { $_.Extension -in '.msix', '.appx' } |
              Select-Object -ExpandProperty FullName)
          }

          $installParams = @{ Path = $bundle.FullName }
          if ($dependencies.Count -gt 0) { $installParams.DependencyPath = $dependencies }
          Add-AppxPackage @installParams

          $installed = Get-AppxPackage -Name 'WinoMail.Beta'
          if ($null -eq $installed) { throw 'WinoMail.Beta was not found after Add-AppxPackage.' }
          Write-Host "Installed WinoMail.Beta $($installed.Version) successfully."

      - name: Upload beta MSIXBundle
        uses: actions/upload-artifact@v4
        with:
          name: WinoMail-Beta-MSIXBundle
          path: \${{ runner.temp }}/WinoMail-Beta-MSIXBundle
          if-no-files-found: error
          retention-days: 14
