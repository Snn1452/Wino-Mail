run-name: Wino Mail Beta MSIXBundle - ${{ github.sha }}
name: Beta MSIXBundle

on:
  push:
    branches:
      - feature/background-sync-host
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: beta-msixbundle-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  build-beta-msixbundle:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      WINO_BETA_RELEASE_SIGNING_ENDPOINT: ${{ secrets.WINO_BETA_RELEASE_SIGNING_ENDPOINT }}
      WINO_BETA_RELEASE_SIGNING_ACCOUNT_NAME: ${{ secrets.WINO_BETA_RELEASE_SIGNING_ACCOUNT_NAME }}
      WINO_BETA_RELEASE_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ secrets.WINO_BETA_RELEASE_SIGNING_CERTIFICATE_PROFILE_NAME }}
      WINO_BETA_RELEASE_PUBLISHER_SUBJECT: ${{ secrets.WINO_BETA_RELEASE_PUBLISHER_SUBJECT }}
      WINO_BETA_RELEASE_AZURE_TENANT_ID: ${{ secrets.WINO_BETA_RELEASE_AZURE_TENANT_ID }}
      WINO_BETA_RELEASE_AZURE_CLIENT_ID: ${{ secrets.WINO_BETA_RELEASE_AZURE_CLIENT_ID }}
      WINO_BETA_RELEASE_AZURE_CLIENT_SECRET: ${{ secrets.WINO_BETA_RELEASE_AZURE_CLIENT_SECRET }}
      WINO_BETA_RELEASE_APPINSTALLER_URI: ${{ vars.WINO_BETA_RELEASE_APPINSTALLER_URI }}
      WINO_BETA_RELEASE_PACKAGE_BASE_URI: ${{ vars.WINO_BETA_RELEASE_PACKAGE_BASE_URI }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check beta artwork
        shell: pwsh
        run: |
          if (-not (Test-Path 'release-assets/Beta/Assets/Wino_Icon.ico')) {
            throw 'Beta artwork is missing under release-assets/Beta.'
          }

      - name: Install Artifact Signing client
        shell: pwsh
        run: |
          nuget install Microsoft.Trusted.Signing.Client -Version 1.0.95 -Source https://api.nuget.org/v3/index.json -OutputDirectory "$env:RUNNER_TEMP/signing" -NonInteractive
          if ($LASTEXITCODE -ne 0) { throw 'Artifact Signing client installation failed.' }

          $dlib = Get-ChildItem "$env:RUNNER_TEMP/signing" -Filter Azure.CodeSigning.Dlib.dll -Recurse |
            Where-Object { $_.FullName -match '[\\/]x64[\\/]' } |
            Select-Object -First 1

          if (-not $dlib) { throw 'The x64 Artifact Signing library was not found.' }
          "WINO_BETA_RELEASE_SIGNING_DLIB_PATH=$($dlib.FullName)" >> $env:GITHUB_ENV

      - name: Validate release packaging logic
        shell: pwsh
        run: ./tests/scripts/Build-Releases.Tests.ps1

      - name: Build and sign beta package
        shell: pwsh
        env:
          NuGetPackageSourceCredentials_github: Username=${{ github.actor }};Password=${{ secrets.GITHUB_TOKEN }}
        run: |
          ./scripts/build-releases.ps1 -NonInteractive -Beta -Architectures x64
          if ($LASTEXITCODE -ne 0) { throw 'Signed beta release build failed.' }

      - name: Verify beta bundle identity and signature
        shell: pwsh
        run: |
          $bundles = @(Get-ChildItem 'src/Wino.Mail.WinUI/AppPackages' -Recurse -File -Filter 'WinoMail_Beta_*.msixbundle' |
            Where-Object { $_.Directory.Name -like 'WinoMail_Beta_*' })

          if ($bundles.Count -ne 1) {
            throw "Expected exactly one beta MSIXBundle, found $($bundles.Count)."
          }

          $bundle = $bundles[0]
          $version = [string]([xml](Get-Content 'src/Wino.Mail.WinUI/Package.appxmanifest')).Package.Identity.Version

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [IO.Compression.ZipFile]::OpenRead($bundle.FullName)
          try {
            $entry = $archive.GetEntry('AppxMetadata/AppxBundleManifest.xml')
            if ($null -eq $entry) { throw 'The beta bundle is missing AppxBundleManifest.xml.' }
            $reader = [IO.StreamReader]::new($entry.Open())
            try { [xml]$manifest = $reader.ReadToEnd() } finally { $reader.Dispose() }
          }
          finally {
            $archive.Dispose()
          }

          $identity = $manifest.Bundle.Identity
          if ([string]$identity.Name -cne 'WinoMail.Beta') {
            throw "Unexpected beta package name: $($identity.Name)"
          }

          if ([string]$identity.Publisher -cne 'CN=Burak Kaan Köse, O=Burak Kaan Köse, L=Wroclaw, S=Dolnośląskie, C=PL') {
            throw "Unexpected beta publisher: $($identity.Publisher)"
          }

          if ([string]$identity.Version -cne $version) {
            throw "Bundle version $($identity.Version) does not match source manifest version $version."
          }

          $signToolRoot = Join-Path ([Environment]::GetEnvironmentVariable('ProgramFiles(x86)')) 'Windows Kits\\10\\bin'
          $signTool = Get-ChildItem $signToolRoot -Filter 'signtool.exe' -File -Recurse |
            Where-Object { $_.Directory.Name -eq 'x64' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1

          if (-not $signTool) { throw 'Windows SDK SignTool was not found.' }

          & $signTool.FullName verify /pa /all /tw $bundle.FullName
          if ($LASTEXITCODE -ne 0) { throw 'SignTool verification failed for the beta MSIXBundle.' }

          $signature = Get-AuthenticodeSignature -FilePath $bundle.FullName
          if ($null -eq $signature.SignerCertificate) {
            throw 'The signed beta bundle does not expose a signer certificate.'
          }

          $publisher = [string]$identity.Publisher
          if ($signature.SignerCertificate.Subject -cne $publisher) {
            throw "Signer subject '$($signature.SignerCertificate.Subject)' does not match publisher '$publisher'."
          }

          $certificatePath = Join-Path $bundle.DirectoryName 'WinoMail_Beta.cer'
          Export-Certificate -Cert $signature.SignerCertificate -FilePath $certificatePath | Out-Null

          $metadata = @(
            "Bundle=$($bundle.Name)"
            "Version=$($identity.Version)"
            "PackageName=$($identity.Name)"
            "Publisher=$publisher"
            'Architecture=x64'
            'Signed=true'
            "CertificateSubject=$($signature.SignerCertificate.Subject)"
            "CertificateThumbprint=$($signature.SignerCertificate.Thumbprint)"
            "SHA256=$((Get-FileHash -LiteralPath $bundle.FullName -Algorithm SHA256).Hash)"
            "Commit=$env:GITHUB_SHA"
          )

          $metadata | Set-Content (Join-Path $bundle.DirectoryName 'beta-msixbundle-metadata.txt') -Encoding utf8

      - name: Install beta bundle smoke test
        shell: pwsh
        run: |
          $bundle = Get-ChildItem 'src/Wino.Mail.WinUI/AppPackages' -Recurse -File -Filter 'WinoMail_Beta_*.msixbundle' |
            Where-Object { $_.Directory.Name -like 'WinoMail_Beta_*' } |
            Select-Object -First 1

          if (-not $bundle) { throw 'Beta MSIXBundle was not found.' }

          $dependencyRoot = Join-Path $bundle.DirectoryName 'Dependencies'
          $dependencies = if (Test-Path $dependencyRoot) {
            @(Get-ChildItem $dependencyRoot -Recurse -File |
              Where-Object { $_.Extension -in '.msix', '.appx' } |
              Select-Object -ExpandProperty FullName)
          } else { @() }

          $installParams = @{ Path = $bundle.FullName }
          if ($dependencies.Count -gt 0) { $installParams.DependencyPath = $dependencies }

          Add-AppxPackage @installParams

          $installed = Get-AppxPackage -Name 'WinoMail.Beta'
          if ($null -eq $installed) {
            throw 'WinoMail.Beta was not found after installation.'
          }

          if ([string]$installed.Version -ne [string]([xml](Get-Content 'src/Wino.Mail.WinUI/Package.appxmanifest')).Package.Identity.Version) {
            throw "Installed beta version $($installed.Version) does not match the source manifest version."
          }

          Write-Host "Installed WinoMail.Beta $($installed.Version) successfully."

      - name: Upload signed beta bundle and certificate
        uses: actions/upload-artifact@v4
        with:
          name: WinoMail-Beta-MSIXBundle
          path: |
            src/Wino.Mail.WinUI/AppPackages/WinoMail_Beta_*/**/*.msixbundle
            src/Wino.Mail.WinUI/AppPackages/WinoMail_Beta_*/**/*.appinstaller
            src/Wino.Mail.WinUI/AppPackages/WinoMail_Beta_*/**/Dependencies/**
            src/Wino.Mail.WinUI/AppPackages/WinoMail_Beta_*/**/WinoMail_Beta.cer
            src/Wino.Mail.WinUI/AppPackages/WinoMail_Beta_*/**/beta-msixbundle-metadata.txt
          if-no-files-found: error
          retention-days: 14
